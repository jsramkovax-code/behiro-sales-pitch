<script>
window.addEventListener('scroll', () => {
  const s = document.documentElement;
  const pct = (s.scrollTop / (s.scrollHeight - s.clientHeight)) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('back-top').classList.toggle('visible', s.scrollTop > 200);
});
document.addEventListener('DOMContentLoaded', function() {
  const ids = ['anchor-pred-schuzkou','anchor-discovery','anchor-demo','anchor-closing','anchor-principy'];
  const links = document.querySelectorAll('#section-nav a');
  function setActive() {
    let current = ids[0];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= 50) current = id;
    });
    links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + current));
  }
  window.addEventListener('scroll', setActive, { passive: true });
  setActive();
  links.forEach(link => {
    link.addEventListener('click', function(e) {
      const href = this.getAttribute('href');
      if (!href || !href.startsWith('#')) return;
      e.preventDefault();
      const target = document.getElementById(href.slice(1));
      if (target) window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 44, behavior: 'smooth' });
    });
  });
});
</script>
<article id="2d4d8a3f-5e39-80fa-aed4-f59cb0a8ec15" class="page sans"><h1 class="page-main-title">Behavera Sales Pitch – Demo call</h1><div style="display:contents" dir="ltr"><figure class="block-color-yellow_background callout" style="white-space:pre-wrap;display:flex" id="2f4d8a3f-5e39-80c1-8f96-fbf033067c14"><div style="font-size:1.5em"><span class="icon">☝🏾</span></div><div style="width:100%"><div id="anchor-pred-schuzkou" class="anchor-target"></div><div style="display:contents" dir="auto"><h4 id="pred-schuzkou" class="">Ještě před schůzkou:</h4></div><div style="display:contents" dir="auto"><p id="2f4d8a3f-5e39-8016-8f92-cc6cd3722be3" class="">Zkontroluj profil firmy, co dělá, také <strong>Jobs / StartupJobs, Atmoskop</strong> → kolik nabírají, jaké mají hodnocení..</p></div></div></figure></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="3817971e-8d47-45e5-bc3d-9bf7f4fa6db9"><div style="width:100%"><div style="display:contents" dir="auto"><hr id="87e19d5f-4b6a-4a64-83b7-6f6878404b18"/></div><div id="anchor-discovery" style="position:relative;top:-64px;visibility:hidden;pointer-events:none;"></div><div id="anchor-discovery" class="anchor-target"></div><div style="display:contents" dir="auto"><h1 id="discovery" class=""><strong>1) Discovery (~5-10 min )</strong></h1></div><div style="display:contents" dir="ltr"><figure class="block-color-yellow_background callout" style="white-space:pre-wrap;display:flex" id="2721a3e9-2ec2-4950-8f46-8475136c8471"><div style="font-size:1.5em"><span class="icon">🧭</span></div><div style="width:100%"><div style="display:contents" dir="auto"><p id=”344d8a3f-5e39-80e9-b932-c32d58cd9588” class=””><strong>Cíl</strong>: Pochopit kontext zákazníka a zjistit, co se reálně děje v jeho týmech</p></div><div style=”display:contents” dir=”auto”><p id=”7afaa111-c9c2-4da0-a21e-63ba234532fb” class=””><strong>Co zjišťuješ:</strong></p></div><div style=”display:contents” dir=”auto”><ul id=”79f5e111-5ae2-4851-84e6-b6865dca1ddf” class=”bulleted-list”><li style=”list-style-type:disc”>Jak fungují jednotlivé týmy / manažeři</li></ul></div><div style=”display:contents” dir=”auto”><ul id=”344d8a3f-5e39-8096-8b85-e7c912abbdb0” class=”bulleted-list”><li style=”list-style-type:disc”>Kde jsou rozdíly ve výkonu nebo atmosféře</li></ul></div><div style=”display:contents” dir=”auto”><ul id=”344d8a3f-5e39-8046-a524-e6ab65063add” class=”bulleted-list”><li style=”list-style-type:disc”>Co konkrétně teď řeší (situace, ne obecné „problémy”)</li></ul></div><div style=”display:contents” dir=”auto”><p id=”7afaa111-c9c2-4da0-a21e-63ba234532fb” class=””><strong>Proč to děláš:</strong></p></div><div style=”display:contents” dir=”auto”><ul id=”344d8a3f-5e39-80cd-b469-e1a48074a721” class=”bulleted-list”><li style=”list-style-type:disc”>Abys to mohl/a později ukázat na datech</li></ul></div><div style=”display:contents” dir=”auto”><ul id=”344d8a3f-5e39-80ce-b469-e1a48074a722” class=”bulleted-list”><li style=”list-style-type:disc”>Abys se k tomu v průběhu callu vracel/a</li></ul></div><div style=”display:contents” dir=”auto”><ul id=”344d8a3f-5e39-80cf-b469-e1a48074a723” class=”bulleted-list”><li style=”list-style-type:disc”>Abys klientovi dokázal/a, že jsi ho pochopil/a</li></ul></div><div style=”display:contents” dir=”auto”><p id=”06197b6d-2d4b-45e6-85da-61d4e5c6f4d8” class=””><strong>Otázky:</strong></p></div><div style=”display:contents” dir=”auto”><ul id=”79f5e111-5ae2-4851-84e6-b6865dca1dfg” class=”bulleted-list”><li style=”list-style-type:disc”>„Kolik vás dneska je?”</li></ul></div><div style=”display:contents” dir=”auto”><ul id=”344d8a3f-5e39-8096-8b85-e7c912abbdb1” class=”bulleted-list”><li style=”list-style-type:disc”>„Kolik máte pod sebou manažerů?”</li></ul></div><div style=”display:contents” dir=”auto”><ul id=”344d8a3f-5e39-8047-a524-e6ab65063add” class=”bulleted-list”><li style=”list-style-type:disc”>„Jsou všichni stejně dobří? Nebo je někdo, kdo výrazně vyniká nebo naopak zaostává?”</li></ul></div><div style=”display:contents” dir=”auto”><ul id=”344d8a3f-5e39-80cd-b469-e1a48074a724” class=”bulleted-list”><li style=”list-style-type:disc”>„Spolupracují mezi sebou ty týmy?”</li></ul></div><div style=”display:contents” dir=”auto”><p id=”06197b6d-2d4b-45e6-85da-61d4e5c6f4c9” class=””><strong>Klíčová otázka na kontext</strong></p></div><div style=”display:contents” dir=”auto”><blockquote id=”be719075-b2e9-4886-a327-69c65a3c69c8” class=””>„Jak je to teď u vás – řešíte spíš nějakou konkrétní věc, nebo chcete mít přehled, aby se vám to nezačalo rozpadat?”</blockquote></div><div style=”display:contents” dir=”auto”><p id=”06197b6d-2d4b-45e6-85da-61d4e5c6e4c9” class=”” style=”font-size:0.85em;color:#888;margin-top:4px”>→ nastavíš kontext callu &nbsp;·&nbsp; víš, jestli prodáváš řešení problému, nebo prevenci &nbsp;·&nbsp; můžeš na to navazovat v celém demu</p></div><div style="display:contents" dir="auto"><h3 id="192cc5a2-3f23-4dda-8fb3-06ab2ef310d8" class=""><strong>Co dělat</strong></h3></div><div style="display:contents" dir="auto"><ul id="344d8a3f-5e39-807f-9fcd-cfc5187bf26c" class="bulleted-list"><li style="list-style-type:disc">Vždy <strong><span style="border-bottom:0.05em solid">sleduj zákazníka</span></strong> na obrazovce. Zajímej se, poslouchej a reaguj na to, co vidíš v jeho tváři.</li></ul></div><div style="display:contents" dir="auto"><ul id="4a946b94-3064-4fbc-9e54-b694fd29d4cb" class="bulleted-list"><li style="list-style-type:disc"><strong><span style="border-bottom:0.05em solid">Potvrzení pochopení</span></strong><strong>:</strong> Po každém dotazu odpověď <strong>zopakuj (parafrázuj)</strong> a shrň, jak jsi to pochopil. Musíš mít s klientem shodu, než půjdeš dál.</li></ul></div><div style="display:contents" dir="auto"><p id="disc-demo-bridge" class=""><strong>Jak to použiješ v demu:</strong></p></div><div style="display:contents" dir="auto"><blockquote id="disc-demo-bridge-quote" class="">„Jak jsme se bavili o vašich manažerech, že někteří fungují líp a někteří hůř, tak tady to přesně vidíte…"</blockquote></div><div style="display:contents" dir="auto"><p style="font-size:0.85em;color:#888;margin-top:4px">→ propojíš Discovery s produktem &nbsp;·&nbsp; roste důvěra, protože vidí, že jsi poslouchal/a</p></div><div style="display:contents" dir="auto"><p id="disc-pointa" class="" style="margin-top:12px"><strong>Klíčová pointa:</strong> Nejde o „pojmenování pain pointů", ale o nasbírání konkrétních situací, ke kterým se pak vracíš a vizualizuješ je v produktu.</p></div></div></figure></div><div style="display:contents" dir="auto"><hr id="80b9f514-b5ad-4371-83bb-5d48b6c36a00"/></div><div id="anchor-demo" style="position:relative;top:-64px;visibility:hidden;pointer-events:none;"></div><div id="anchor-demo" class="anchor-target"></div><div style="display:contents" dir="auto"><h1 id="demo" class=""><strong>2) Demo</strong></h1></div><div style="display:contents" dir="auto"><p id="065943b4-d47b-489c-9caa-093c8cf43aa8" class=""><strong>Cíl</strong>: Ukázat zákazníkovi příběh, ne všechny funkce produktu</p></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="f1ad1bda-7435-4e09-aab7-8ac40c222f23"><div style="width:100%"><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.5em;line-height:1.3;margin:0">a) Úvod → Co uvidíte a jak vám to pomůže rozhodovat</summary><div class=”indented”><div style=”display:contents” dir=”auto”><h3 id=”cf0a2e92-8f8a-4034-97fb-27849dfe37d3” class=””>Úvod (framing – pohled CEO)</h3></div><div style=”display:contents” dir=”auto”><blockquote id=”c0874645-51a9-41ad-88fe-08f878b0c437” class=””>„Ukážu vám, jak to budete používat vy – co z toho uvidíte a jak vám to pomůže rozhodovat.”</blockquote></div><div style=”display:contents” dir=”auto”><blockquote id=”c0874645-51a9-41ad-88fe-08f878b0c438” class=””>„Jak jste říkal/a, máte víc týmů a není vždy jasné, kde to zrovna hoří a kam dát energii jako první.”</blockquote></div><div style=”display:contents” dir=”auto”><p style=”font-size:0.85em;color:#888;margin-top:2px”>👉 Tady rovnou ukázat dashboard</p></div><div style=”display:contents” dir=”auto”><h3 id=”8e566dbc-fd7b-48ef-9ac2-c7e26c48f25e” class=””>Sběr dat (zmínit krátce, bez detailu)</h3></div><div style=”display:contents” dir=”auto”><p id=”183d3a25-710b-4067-84e9-0841299dc927” class=””><em>„Ta data vznikají z krátkého check-inu s lidmi, ke kterému se klidně vrátíme.”</em></p></div><div style=”display:contents” dir=”auto”><h3 id=”8bf05707-d353-4d41-ac85-3412fb44e983” class=””>Témata</h3></div><div style=”display:contents” dir=”auto”><p id=”8bf05707-d353-4d41-ac85-3412fb44e982” class=””>„Na začátku se zaměřujeme jen na pár klíčových oblastí, které mají největší dopad.” <span style=”color:#888;font-size:0.9em”>(např. leadership, změny, priority, adaptace AI)</span></p></div><div style=”display:contents” dir=”auto”><h3 id=”8577d22e-c17c-48b1-8dce-fc657052d6d8” class=””>Rychlost a účast</h3></div><div style=”display:contents” dir=”auto”><p id=”093e2dc6-23ba-427e-bf59-d1ed462eef99” class=””>„Je to pro lidi velmi rychlé, nezatěžuje je to.”</p></div><div style=”display:contents” dir=”auto”><p style=”font-size:0.85em;color:#888;margin-top:2px”>👉 Detail rozvést až při ukázce check-inu: „Jak vidíte, zabere to opravdu chvilku – proto máme vysokou účast: <strong>nad 80 % u kancelářských pozic</strong>, <strong>60–70 % i ve výrobě</strong>.”</p></div><div style=”display:contents” dir=”auto”><h3 id=”479a00ac-1a17-4911-b056-a84186f7db67” class=””>Rychlá ukázka check-inu (30 vteřin)</h3></div></div></details></div></div></figure></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="26a0ac32-414a-42b5-8cf0-79a06520978e"><div style="width:100%"><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.5em;line-height:1.3;margin:0">b) Jak to budete používat vy</summary><div class="indented"><div style="display:contents" dir="auto"><p id="344d8a3f-5e39-80c3-b614-fac7258da838" class=""><mark class=”highlight-pink”>Vyber téma “</mark><mark class=”highlight-pink”><strong>nástroje</strong></mark><mark class=”highlight-pink”>”</mark></p></div><div style=”display:contents” dir=”auto”><p id=”dash-intro-teď” class=””>„Teď vám ukážu, jak to budete používat vy. Začneme tím nejdůležitějším – kde je potřeba zasáhnout, pak se podíváme na manažery a nakonec detailně do týmů.”</p></div><div style=”display:contents” dir=”auto”><h3 id=”dash-view-1” class=””>1. Přehled – co řešit jako první</h3></div><div style=”display:contents” dir=”auto”><blockquote id=”dash-view-1-q” class=””>„Tady hned vidíte, kde to zrovna hoří a kam dát pozornost.”</blockquote></div><div style=”display:contents” dir=”auto”><h3 id=”344d8a3f-5e39-80c4-b625-ee5996f0c0b0” class=””>2. Manažeři – kde jsou rozdíly</h3></div><div style="display:contents" dir="auto"><blockquote id="344d8a3f-5e39-80ba-a1f8-e668fd46f2e7" class="">„Výstupy máte rovnou <strong>k dispozici online ihned</strong>, máte k nim přístupy vy, hr, nebo komu je dáte.”</blockquote></div><div style="display:contents" dir="auto"><h3 id="345d8a3f-5e39-8003-828f-ffd94e4f9e45" class="">Manažeři – kde jsou mezi nimi rozdíly</h3></div><div style="display:contents" dir="auto"><blockquote id="345d8a3f-5e39-80f0-9640-d3708492eb7d" class="">„Tady vidíte jednotlivé manažery a kde jsou mezi nimi rozdíly – kde to funguje, ve kterých týmech lidi stagnují nebo jsou kriticky nespokojení.</blockquote></div><div style="display:contents" dir="auto"><h3 id="345d8a3f-5e39-800a-aa46-f0930e8b1066" class="">Potvrzení intuice</h3></div><div style="display:contents" dir="auto"><blockquote id="345d8a3f-5e39-809f-a774-cb815c8be0ac" class="">„Často to už nějak tušíte, ale tohle vám to ale potvrdí daty.“</blockquote></div><di ap;display:flex" id="345d8a3f-5e39-80c8-a7c4-f3288dc954f7"><div style="width:100%"><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.5em;line-height:1.3;margin:0"><strong>d) AI chatbot</strong></summary><div class="indented"><div style="display:contents" dir="auto"><h3 id="345d8a3f-5e39-8091-8ad3-da778a363b29" class="">Bezpěčná uzavřená AI</h3></div><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-80c6-bfb5-cb2de7d6bb93" class="">Abyste si nemuseli výsledky kopírovat někde ven do AI, tak jsme ji bezpěčně formou gemini implemnetovali přímo tady.</p></div><div style="display:contents" dir="auto"><h3 id="345d8a3f-5e39-802c-9227-e684bf482e9c" class="">Kontext odpovědí i vaší firmy</h3></div><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-8046-a0a5-d7ad7df4ee05" class="">Výhodou navíc je, že si to tady drží kontext vstupů lidí, ale taky kontext vaší firmy, takže o to jsou ty výsledky relevantnější.</p></div><div style="display:contents" dir="auto"><h3 id="345d8a3f-5e39-80f0-a051-d47039ece173" class="">Příklad</h3></div><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-80e7-a437-c39b7d252c01" class=""><mark class="highlight-pink">Třeba jedna firma řešila změnu ERP systému, a lidi s tím měli hodně problémů, takže si na to sledovali. Ale ta firma to měla nařízené od italské matky, takže nebylo možné to nedělat. Tzn tuhle informaci jsme dali do systému tak, aby ta doporučení nebyla typu “zvažte neměnit systém, lidem to vadí”, ale byly tam relevantní návrhy ohledně zlepšení komunikace a procesu. </mark></p></div><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-80b0-a274-c54be39a5e3e" class="">
</p></div></div></details></div></div></figure></div><div style="display:contents" dir="auto"><hr id="345d8a3f-5e39-807d-8ecf-dd21b2a08950"/></div><div id="anchor-closing" style="position:relative;top:-64px;visibility:hidden;pointer-events:none;"></div><div id="anchor-closing" class="anchor-target"></div><div style="display:contents" dir="auto"><h1 id="closing" class=""><strong>3) Closing</strong></h1></div><div style="display:contents" dir="ltr"><figure class="block-color-purple_background callout" style="white-space:pre-wrap;display:flex" id="7e43f8fd-dbb7-405e-a8b6-84d9ced33bfc"><div style="width:100%"><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-8066-8f1e-de9b5c1774d6" class=""><mark class="highlight-pink">Třeba využít zjištění z discovery a z reakcí během demo</mark></p></div><div style="display:contents" dir="auto"><h3 id="0e31a4d5-eeb6-4500-a697-3baf672f3c4d" class=""><strong>Přechod z dema do closing</strong></h3></div><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-80ce-966c-d108aae212ce" class="">“Co bychom dali u vás jako kontext? A které téma byste nejradší spustil jako první? e to spíš výkon/leadership manažerů, přetížení a priority, nebo třeba adaptace na změnu?”</p></div><div style="display:contents" dir="auto"><h3 id="345d8a3f-5e39-802a-9ad3-e6f1b0a517b5" class="">Shrnutí situace a přidané hodnoty pro zákazníka</h3></div><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-809d-b06e-c5b87c2363e5" class="">„Jestli to shrnu: chcete rychle jistotu ohledně … a vidět rozdíly mezi … bez velkého interního projektu.“</p></div><div style="display:contents" dir="auto"><h3 id="345d8a3f-5e39-8062-8d67-f845032a5fbf" class="">Cena</h3></div><div style="display:contents" dir="auto"><p class="">„Jen abychom to dali do kontextu: firmy jako ta, co jsem vám ukazoval, ušetří jeden nebo dva zbytečné odchody ročně. Jeden odchod vás typicky stojí 3–6 měsíčních platů — to je násobek toho, co platí za Behaveru celý rok.“</p></div><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-80e2-9476-c7d622f9cd31" class="">„Ještě jsme se nebavili o ceně - vy máte 90 lidí, bude vás to stát 5 900 Kč měsíčně při roční platbě. Je to v rozsahu, se kterým umíte pracovat?“</p></div><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-8032-8d2c-f0772555c820" class="">„Kdyby se ukázalo, že vám to z nějakého důvodu vůbec nesedí, do 30 dnů vám peníze vrátíme.“</p></div><div style="display:contents" dir="auto"><h3 id="345d8a3f-5e39-80ac-90a2-d7edf5b7b87e" class="">Next steps</h3></div><div style="display:contents" dir="auto"><p id="0c781440-ceff-467e-91df-87e0c587fb64" class="">„Super, když se dohodneme, tak další kroky jsou jednoduché: potvrdíme spolupráci a kolegyně to s vámi nastaví do 30 minut.“</p></div><div style="display:contents" dir="auto"><p id="21f6a81b-957e-42d0-a7e7-715cdbddc135" class="">„Máme připravenou i komunikaci, kterou můžete poslat do firmy — nic nemusíte vymýšlet, jen to přizpůsobíte a odešlete.“</p></div><div style="display:contents" dir="auto"><h3 id="5f1a03b5-55bf-4942-9e99-e1fdb301d4aa" class=""><strong>Bezpečné closing otázky</strong></h3></div><div style="display:contents" dir="auto"><p id="f4dc119f-e1b3-41da-823e-01beccba1c56" class="">„Chcete to posunout do pilotu a domluvit onboarding call?“</p></div><div style="display:contents" dir="auto"><p id="98b49202-7526-45b8-9ca2-ebd59775ecd1" class="">„Co potřebujete vy (nebo někdo další u vás), aby se mohl udělat další krok?“</p></div><div style="display:contents" dir="auto"><h3 class=""><strong>Když zákazník mlčí nebo váhá</strong></h3></div><div style="display:contents" dir="auto"><p class=""><mark class="highlight-orange_background">✔ Neříkej nic. Nech ticho. První kdo mluví, prohrají.</mark></p></div><div style="display:contents" dir="auto"><p class="">Pokud ticho trvá déle než 10 vteřin: „Co vám teď hlavou běží?“</p></div><div style="display:contents" dir="auto"><p class="">Pokud zákazník říká „musím si to rozmíslet“: „To chápu. Co konkrétně chcete zvážit? Ať vím, jestli vám s tím můžu pomoct hned.“</p></div><div style="display:contents" dir="auto"><p class="">Pokud říká „porádím se s kolegy“: „Kdo konkrétně by měl být u toho rozhodnutí? Má smysl je přizvat na krátký call?“</p></p></div></div></figure></div><div style="display:contents" dir="auto"><hr id="345d8a3f-5e39-8009-8f43-f93d2a5b8487"/></div><div style="display:contents" dir="auto"><div id="345d8a3f-5e39-80e0-9685-e2ffd2e1fefc" class="column-list"><div style="display:contents" dir="auto"><div id="345d8a3f-5e39-8023-bae4-d92db26967fa" style="width:50%" class="column"><div style="display:contents" dir="ltr"><figure class="block-color-teal_background callout" style="white-space:pre-wrap;display:flex" id="345d8a3f-5e39-8093-b1ce-c56e8ea57573"><div style="width:100%"><div id="principy" style="position:relative;top:-64px;visibility:hidden;"></div><div id="anchor-principy" class="anchor-target"></div><div style="display:contents" dir="auto"><h2 id="principy" class="">Principy</h2></div><div style="display:contents" dir="auto"><ul id="345d8a3f-5e39-8064-bfad-d54fe4d309a0" class="bulleted-list"><li style="list-style-type:disc">Demo = příběh, ne seznam funkcí</li></ul></div><div style="display:contents" dir="auto"><ul id="345d8a3f-5e39-80af-8cec-e33b9cb0394f" class="bulleted-list"><li style="list-style-type:disc">Vždy navazovat a odkazovat na discovery</li></ul></div><div style="display:contents" dir="auto"><ul id="345d8a3f-5e39-805b-8077-d711daa0dab5" class="bulleted-list"><li style="list-style-type:disc">Sledovat zákazníka i během dema!</li></ul></div><div style="display:contents" dir="auto"><ul id="345d8a3f-5e39-8063-95c7-f46d39fcded5" class="bulleted-list"><li style="list-style-type:disc">V každé sekci se zeptat na konkrétní otázku<div style="display:contents" dir="auto"><ul id="345d8a3f-5e39-8001-9eff-fc6563736a67" class="bulleted-list"><li style="list-style-type:circle">“Vidíte, které týmy by na tom u vás jak byly?”</li></ul></div><div style="display:contents" dir="auto"><ul id="345d8a3f-5e39-8008-a302-ca4fce3c6a4f" class="bulleted-list"><li style="list-style-type:circle">“Máte manažera, který by ten playbook využil? Možná někdo v manažerské pozici juniornější?”</li></ul></div></li></ul></div><div style="display:contents" dir="auto"><ul id="345d8a3f-5e39-8056-b749-f9c2c133db2b" class="bulleted-list"><li style="list-style-type:disc">Mluvit méně, nechat klienta reagovat</li></ul></div></div></figure></div></div></div><div style="display:contents" dir="auto"><div id="345d8a3f-5e39-8087-b3a3-ca1eff2bf374" style="width:50%" class="column"><div style="display:contents" dir="ltr"><figure class="block-color-red_background callout" style="white-space:pre-wrap;display:flex" id="344d8a3f-5e39-802a-b5e4-d3f9dd6c1ae7"><div style="width:100%"><div style="display:contents" dir="auto"><h3 id="344d8a3f-5e39-803a-ac80-c3e6022fd22c" class=""><strong>Zakázaná slova</strong></h3></div><div style="display:contents" dir="auto"><ul id=”344d8a3f-5e39-802d-b518-d82e0d54c0b6” class=”bulleted-list”><li style=”list-style-type:disc”>❌ „nabídka”</li></ul></div><div style=”display:contents” dir=”auto”><ul id=”344d8a3f-5e39-802d-b518-d82e0d54c0b7” class=”bulleted-list”><li style=”list-style-type:disc”>❌ „dotazník”</li></ul></div><div style="display:contents" dir="auto"><ul id="344d8a3f-5e39-8007-bdcc-d49804813649" class="bulleted-list"><li style="list-style-type:disc">❌ „asi se shodneme“</li></ul></div><div style="display:contents" dir="auto"><ul id="344d8a3f-5e39-80dd-a44d-e3401b7764ed" class="bulleted-list"><li style="list-style-type:disc">❌ „jen se zeptám“</li></ul></div><div style="display:contents" dir="auto"><ul id="344d8a3f-5e39-806c-a7ec-e51aef47dc57" class="bulleted-list"><li style="list-style-type:disc">❌ &quot;co na to říkáte?&quot; </li></ul></div><div style="display:contents" dir="auto"><ul id="345d8a3f-5e39-80e3-9de7-e43fe83f89ee" class="bulleted-list"><li style="list-style-type:disc">❌ &quot;Dává vám to smysl?&quot; </li></ul></div><div style="display:contents" dir="auto"><ul id="345d8a3f-5e39-80da-9272-eec7b6ff079f" class="bulleted-list"><li style="list-style-type:disc">❌ &quot;Má to pro vás využití?&quot;</li></ul></div><div style="display:contents" dir="auto"><ul id="344d8a3f-5e39-8090-adbf-e51857987676" class="bulleted-list"><li style="list-style-type:disc">❌ &quot;obecně&quot;</li></ul></div><div style="display:contents" dir="auto"><ul id="344d8a3f-5e39-809a-88b6-dfeb811e8539" class="bulleted-list"><li style="list-style-type:disc">❌ &quot;tady je sloupeček, tady kliknu&quot;</li></ul></div><div style="display:contents" dir="auto"><ul id="344d8a3f-5e39-801f-b846-c93826663acd" class="bulleted-list"><li style="list-style-type:disc">❌ &quot;lingvistika&quot;</li></ul></div><div style="display:contents" dir="auto"><ul id="344d8a3f-5e39-800d-88c5-e87b4ebdd9d4" class="bulleted-list"><li style="list-style-type:disc">❌ &quot;agažovanost&quot; jako hlavní framing</li></ul></div></div></figure></div><div style="display:contents" dir="auto"><p id="345d8a3f-5e39-801f-b3e3-d87c35d49ed4" class="">
</p></div></div></div></div></div><div style="display:contents" dir="auto"><hr id="32fd8a3f-5e39-8069-96d6-e8a0af0d2289"/></div><div style="display:contents" dir="auto"><h2 id="2d6d8a3f-5e39-805a-87a4-c2196693eb98" class="">Pokud se zákazník zdráhá, nauč se reagovat na námitky &gt;&gt; <mark class="highlight-orange"><strong><a href="https://www.notion.so/NEW-4-2-Handbook-Demo-questions-objections-2d6d8a3f5e398076aee7ed1856d5d0ed?pvs=21">Časté námitky </a></strong></mark></h2></div><div style="display:contents" dir="auto"><p id="2d6d8a3f-5e39-80ec-8c99-d11668295a19" class="">
</p></div><div style="display:contents" dir="auto"><p id="2d6d8a3f-5e39-80f1-b032-c729b7de18a5" class="">
</p></div></div></article>


<script id="sales-enhance">
document.addEventListener('DOMContentLoaded', function() {
  const FULL_QUOTE = /^[\u201e\u201c\u0022\u201d]/;

  // All confirmed non-quoted direct speech paragraphs
  const IMPLICIT_SPEECH = [
    /^My\s/,
    /Vid\u00edm,\s/,                   // Vidím, že...
    /nemus\u00edte/i,                   // nemusíte
    /^M\u016f\u017eete\b/,             // Můžete
    /^V\u00fdhodou\b/,                 // Výhodou navíc je...
    /^Abyste\b/,                        // Abyste si nemuseli...
    /^Nap\u0159\u00edklad tady/,       // Například tady v té firmě...
    /va\u0161\u00ed firm/i,            // vaší firmy/firmě
    /jsme ji/i,                         // jsme ji implementovali
    /^C\u00edlem je\b/,                // Cílem je aby se z manažerů...
    /^T\u011bch t\u00e9mat\b/,        // Těch témat je tam hodně...
    /^Super na tom je\b/,              // Super na tom je...
    /^Tak\u017ee m\u00e1me\b/,        // Takže máme velmi dobrou response rate...
  ];

  // Blockquotes — Demo section speech
  document.querySelectorAll('blockquote').forEach(el => {
    if (el.textContent.trim().length > 10) el.classList.add('sales-script');
  });

  // Principy anchor — skip everything after it
  const principyAnchor = document.getElementById('anchor-principy');

  document.querySelectorAll('.callout p, .callout li').forEach(el => {
    if (principyAnchor &&
        !(el.compareDocumentPosition(principyAnchor) & Node.DOCUMENT_POSITION_FOLLOWING)) return;
    const t = el.textContent.trim();
    if (t.startsWith('\u274C') || t.startsWith('\u2714') || t.length < 6) return;
    // Skip labels and action instructions (note: Cíl: with colon, not Cílem)
    if (/^(C\u00edl:|Ot\u00e1zky:|F\u00e1ze|Shrnut\u00ed|Cena|Next steps|Bezpe\u010dn\u00e1|Kontext|P\u0159\u00edklad|Akce|T\u00e9mata|Rychlost|Rychl\u00e1|T\u0159eba vyu\u017e\u00edt|Potvrzen\u00ed|Rozklikni|Vyber|P\u0159echod)/.test(t)) return;

    if (FULL_QUOTE.test(t) || IMPLICIT_SPEECH.some(re => re.test(t))) {
      el.classList.add('sales-script');
    } else {
      el.innerHTML = el.innerHTML.replace(/\u201e([^\u201c]+)\u201c/g,
        '<em class="inline-quote">\u201e$1\u201c</em>');
    }
  });

  // Silence tip
  document.querySelectorAll('p, li').forEach(el => {
    if (el.textContent.includes('Prvn\u00ed kdo mluv\u00ed')) el.classList.add('sales-silence');
  });

  // Forbidden words
  document.querySelectorAll('li').forEach(li => {
    if (li.textContent.trim().startsWith('\u274C')) li.parentElement.classList.add('sales-forbidden');
  });

  // Stats
  document.querySelectorAll('p, li').forEach(el => {
    el.innerHTML = el.innerHTML
      .replace(/nad 80\s*%/g, '<span class="sales-stat">nad 80\u00a0%</span>')
      .replace(/60\s*%[-\u2013]\s*70\s*%/g, '<span class="sales-stat">60\u201370\u00a0%</span>')
      .replace(/5\s*900\s*K\u010d/g, '<span class="sales-stat">5\u00a0900\u00a0K\u010d/m\u011bs</span>');
  });
});
</script>
