<header><div class="page-header-icon undefined"><span class="icon">📷</span></div><h1 class="page-title" dir="auto">Behavera – Objections</h1><p class="page-description" dir="auto"></p></header><div class="page-body"><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="2e3d8a3f-5e39-8071-a6c2-fd05d7b4ce00"><div style="font-size:1.5em"><span class="icon">☝🏾</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h3 id="2e3d8a3f-5e39-8004-a64f-db57dae69de8" class=""><strong>Když zazní objection, akceptuj ji a zjisti, co za ní je. Nesnaž se hned dokázat svou pravdu.</strong></h3></div></div></figure></div><div style="display:contents" dir="auto"><h2 id="329d8a3f-5e39-8069-aa3b-e83975bfcef3" class="">Objections – přehled podle témat (co tady najdeš)</h2></div><div style="display:contents" dir="ltr"><figure class="block-color-orange_background callout" style="white-space:pre-wrap;display:flex" id="080e61e3-402e-41dc-9113-d07fbd5d9e6b"><div style="font-size:1.5em"><span class="icon">🔥</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h2 id="3e847e7b-8b0f-4ae7-b756-661dcb6aac22" class="">Most popular objections</h2></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">1) Nepotřebujeme nástroj na zpětnou vazbu</summary><div class="indented"><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">a) Jsme malí a bavíme se každý den, nepotřebujeme takový nástroj</summary><div class="indented"><div style="display:contents" dir="auto"><p id="859d45e1-23a0-4398-97d9-d763b460f283" class=""><strong>Reakce:</strong><em><mark class="highlight-purple"><br/><br/></mark></em><em>„Menší týmy berou často komunikaci jako samozřejmost. Ale kdy vám naposledy někdo řekl nepříjemný názor úplně na rovinu?“</em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-804d-8d31-c8a84e63c348" class=""><strong>Zákazník typicky řekne: </strong>no… občas / spíš výjimečně / někteří ano</p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8042-b84a-d73917a1f9c6" class=""><em>„Přesně tak, a pak často slyšíte jen ty hlasitější nebo vám nejbližší lidi, a část věcí se k vám vůbec nedostane.“</em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8046-acc9-f27455097810" class=""><em><mark class="highlight-pink">“</mark></em><em><mark class="highlight-pink"><strong>Giuseppe</strong></mark></em><em><mark class="highlight-pink">: ja jsem mel taky leadera a meli jsme dobry vztah. ale byl yveci, ktere jsem, mu proste do oci nerekl, protoze mi to bylo blbý, rikal jsem si ze to mozna neni priorita, at neotravuju. ale vnitrne me to stvalo cim dal vic, a kdyby se me nekdo na to proaktivne zeptal., tak to tam vzdycky napisu. Nakonec jsem mu to rekl az kdyz uz jsem, byl prilos nastvany”</mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8078-94d9-d0264b3926e0" class=""><em><mark class="highlight-pink">“Jeden z našich co-founderu Jirka Valena použil Echo Pulse ve firmě Valxon o 15 lidech, ve které se normálně bavili napřímo. I tak zjistili,</mark></em><em><mark class="highlight-pink"><strong> že mnohem více napíšou anonymně </strong></mark></em><em><mark class="highlight-pink">než řeknou napřímo v osobním rozhovoru. Díky tomu zjistlii že někteří byli vnitřně demotivovaní a zbytečně odcházeli - jeden se k nim dokonce vrátil když ho kontaktovali”</mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80f7-9674-e4d5c6d9afbc" class=""><em>„Kdybyste se zeptali anonymně vašich lidí, co myslíte, že by tam padalo?“</em></p></div><div style="display:contents" dir="auto"><hr id="343d8a3f-5e39-808c-9b33-fbb4b970b9d9"/></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-802f-a525-ed18ad8d7271" class=""><strong>Zákazník typicky řekne: </strong>že toho je moc / že se mění věci a neví proč / že nemají jasno v prioritách / že se věci nedotahují / že vedení není dost vidět</p></div><div style="display:contents" dir="auto"><hr id="343d8a3f-5e39-80f3-9578-d1adb1136879"/></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8098-adc2-c60ee44fbb71" class=""><em>„Přesně. A tohle jsou ty věci, které se do běžných rozhovorů často nedostanou.“</em></p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">b) Já poznám, jestli jsou lidi v pohodě – když se s nimi bavím</summary><div class="indented"><div style="display:contents" dir="auto"><p id="36371f9d-5ee9-4b0c-9af5-a94ac6df289a" class=""><strong>Validace:</strong></p></div><div style="display:contents" dir="auto"><p id="c86365d1-41d0-4c5d-a2a6-49ffdabc4a02" class=""><em>„To dává smysl – a je vidět, že jste zkušený lídr.“</em></p></div><div style="display:contents" dir="auto"><hr id="51c7b43a-44bc-4d4b-8579-b9c549e182d8"/></div><div style="display:contents" dir="auto"><p id="adf12062-13f6-422d-aa25-fce57599cb68" class=""><strong>Přesměrování na škálování (a ticho):</strong></p></div><div style="display:contents" dir="auto"><p id="0a3a9b1e-f1c6-4372-9c69-a3735a1fb643" class=""><em>„A co manažeři pod vámi – jsou stejně dobří jako vy?“</em></p></div><div style="display:contents" dir="auto"><hr id="db1d83a8-e311-4ca4-a483-af71e36494a8"/></div><div style="display:contents" dir="auto"><p id="776338a4-2a20-4ea7-8cc2-b1efa7e914e9" class=""><em>„Který z vašich manažerů je dneska nejlepší?“</em></p></div><div style="display:contents" dir="auto"><p id="11469f8a-89c8-47dd-a72d-3f87754168ae" class=""><em>(pause)</em></p></div><div style="display:contents" dir="auto"><hr id="1b32b1d6-cd95-4ac3-924d-cde0a27d3b11"/></div><div style="display:contents" dir="auto"><p id="58e90db3-cafe-4db4-9630-9659f64e73dd" class=""><strong>Efektivita (čas + priorita):</strong></p></div><div style="display:contents" dir="auto"><p id="9fd6a65a-b102-44cb-89a5-7b34522e0b27" class=""><em>„A ještě jedna věc: i kdybyste měl/a skvělý instinkt, pořád je to hodně času a pořád trochu hádání. My vám to zefektivníme tím, že dostanete jasnou prioritu toho, co řešit jako první – podle dat z týmů.“</em></p></div><div style="display:contents" dir="auto"><hr id="f7d3d8fc-a019-4651-8b42-308836a67b88"/></div><div style="display:contents" dir="auto"><p id="5f114af3-9ba2-46a8-83e4-1687a1b6a135" class=""><strong>Upřímná realita bez domněnek:</strong></p></div><div style="display:contents" dir="auto"><p id="55fa7e0d-fc37-48b9-bc29-890e396e8d69" class=""><em>„A hlavně: nemusíte se domnívat nebo doufat, že vám to lidi řeknou sami od sebe. Anonymně vám napíšou i věci, které by do očí neřekli ani dobrému lídrovi.“</em></p></div><div style="display:contents" dir="auto"><hr id="64743053-39fe-4c30-8694-ee142a0445a0"/></div><div style="display:contents" dir="auto"><p id="1e5a4807-38dc-4590-a704-3bc1b846a58a" class=""><strong>Pointa:</strong></p></div><div style="display:contents" dir="auto"><p id="e558106c-0bb9-4a15-bc13-5ac043c4eee4" class=""><em>„A co kdybychom dokázali udělat všechny vaše manažery tak dobrými – tím, že jim dáme včas a pravidelně zpětnou vazbu z jejich týmů?“</em></p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">c) My si to už říkáme, děláme 1on1s</summary><div class="indented"><div style="display:contents" dir="auto"><p id="43969768-a3f5-488a-838c-bee6d29d9636" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="95d01a1f-e27a-4be4-b4dc-5d72ad69ef92" class=""><em><mark class="highlight-default">„Tak to je super, a kdy jste se naposledy dozvěděli něco nepříjemného, co vás fakt překvapilo?“</mark></em></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-80d4-8757-deba7235326d"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8096-b846-caed25031393" class=""><strong>Zákazník typicky řekne: </strong><em>„no… to se moc nestává / spíš výjimečně / lidi jsou otevření“</em></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-80f5-a32f-c64649851d2c"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8091-9180-de2b02dc2caa" class=""><em>„Rozumím. My právě často vidíme, že tyhle věci se do 1:1 vůbec nedostanou, ne protože by lidi nechtěli, ale protože je to v tu chvíli nepříjemné nebo to nepovažují za prioritu.“</em></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80ed-a680-feac78575470" class="">Osobní story: “<em>Protože vám řeknu vlastní zkušenost - Já když jsem měl v bývalé práci lídra, tak jsme měli krásný vztah. Ale přesto jsem mu některé věci osobně prostě nebyl schopný říct. Styděl jsem se, nebo mi to v tu chvíli přislo že to není priorita, nebo mi bylo prostě nepříjemné s ním něco negativního otevřít”</em></p></div><div style="display:contents" dir="auto"><p id="318b6a65-a6eb-4e97-bfec-9c108d8189e3" class=""><strong>Follow-up na 1on1s:</strong></p></div><div style="display:contents" dir="auto"><p id="17d7b514-44be-40d9-b66e-a8a00171e804" class="">„Proto to bereme jako doplněk k 1:1. Zaprvé to zachytí věco, které na 1on1 nevyplynou, a 2. to dá podklady aby manažeři na 1on1 řešili priority, a nehledali témata.</p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">d) Nic nás netrápí</summary><div class="indented"><div style="display:contents" dir="auto"><h4 id="332d8a3f-5e39-8067-9c86-f53dc08538ee" class="">A) (CEO)</h4></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-802f-b7a6-d848fa174aeb" class=""><em>“A to tak bylo vždycky?” </em></p></div><div style="display:contents" dir="auto"><hr id="333d8a3f-5e39-8067-86e9-cf1e4976d88a"/></div><div style="display:contents" dir="auto"><p id="333d8a3f-5e39-8025-ab89-e4e95521f489" class=""><strong>Když zákazník řekne: </strong>prošli jsme si dynamickou fází/ jednu dobu bylo perno</p></div><div style="display:contents" dir="auto"><p id="333d8a3f-5e39-803f-b480-c4cc1679abc3" class=""><em>→ “A jste si jisti, že se to tam nemuže vrátit?”</em></p></div><div style="display:contents" dir="auto"><hr id="333d8a3f-5e39-808d-80f4-d826d669b341"/></div><div style="display:contents" dir="auto"><p id="333d8a3f-5e39-801e-a480-fcf1f88d8957" class=""><strong>Když zákazník řekne: </strong>ano, máme štěstí</p></div><div style="display:contents" dir="auto"><hr id="333d8a3f-5e39-80ef-8434-c55874857484"/></div><div style="display:contents" dir="auto"><p id="d3c17978-c91e-4c85-a214-f18bd364306c" class=""><em>→ „To je super. A který tým vám dnes funguje nejlépe? </em></p></div><div style="display:contents" dir="auto"><p id="333d8a3f-5e39-80e1-b550-c915c454217f" class=""><em>“A co za tím je? Je to tím lídrem, nebo těmi lidmi v něm?” </em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8060-b9a2-ebb7aa4a5c09" class="">mlčet</p></div><div style="display:contents" dir="auto"><p id="333d8a3f-5e39-8080-a15b-d01c0dc252e1" class="">“Dokážete si představit, že tak dobře fungují všechny týmy? Čím se to dá změnit?”</p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80c9-8e26-f4c5fc2523c2" class="">Pokud stále defenzivní:</p></div><div style="display:contents" dir="auto"><ul id="343d8a3f-5e39-80a4-a371-e90c1aa49723" class="bulleted-list"><li style="list-style-type:disc"><em>pokud to tak mate tak super, tak nas nepotrebujete. jestli mi date 15-20 minut a reknete mi proc to tak funguje tak budu rad, většina firem řeší nějaké problémy, já fakt rád pochopím, jak se to má dělat.</em></li></ul></div><div style="display:contents" dir="auto"><h4 id="332d8a3f-5e39-808d-bac2-e475f09106eb" class="">B) HR</h4></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80d6-a51b-cc57639b0cbe" class="">Usetrit práci/být borka před vedením</p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">e) My spíš potřebujeme nové lidi, než že by nám odcházeli</summary><div class="indented"><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80f2-8d7a-fe803248fa7f" class="">Buď reframe </p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80ac-858a-c1b778fc647a" class=""><em>“Jsou vsichni lidri stejne dobri? - pomuzeme tem slabsim byt nejlepsi” - </em>viz úředchozí objection</p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80bc-b37f-e07f29adfb08" class="">nebo jít na employer brand</p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8045-b98d-c9027b72e307" class=""><em>„Rozumím. A odkud k vám dneska přichází ti nejlepší lidi? Z jobsů, startupjobs, nebo referral? </em>(kdyz neodpoví referal, tak rict, ze z dat vyplývá, že je to referral, takoví lidi zustavaji ve firme dlouho, jsou loyalni a dobry fit)</p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-80e1-a803-e4b2af08413a"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80e1-9c80-d7102fcd17a0" class=""><strong>Zákazník typicky řekne: </strong>kombinace, ale nejlepší jsou přes lidi - referral </p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-8084-b726-d16e0fae5614"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8054-bc79-c9d823e2ec30" class=""><em>„A co podle vás rozhoduje o tom, jestli vás ti lidi doporučí dál?“</em></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-8041-b456-f9cceafc6e25"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8086-8053-fda2d4fa15e0" class=""><strong>Zákazník typicky řekne: </strong>když jsou spokojení / když mají dobrou zkušenost</p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-8040-a125-d2e87cad98d7"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8078-88c8-ea58b92f90d8" class=""><em>„Přesně. To, jak se dneska cítí lidi uvnitř, se pak přímo propisuje do toho, jak se vám daří nabírat. A tohle je to, co vám tohle pomůže zviditělnit a na čem budete moct aktivněji pracovat“</em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8085-a771-c44aa24fd0e6" class=""><em><mark class="highlight-pink">Třeba v </mark></em><em><mark class="highlight-pink"><strong>Průša research</strong></mark></em><em><mark class="highlight-pink"> nás přesně na to využili - nejprve přímo jako průzkum na employer brand, kdy za 3 minuty zjistili, jake maji ve firmě persony a na základě čeho mají lákat a hirovat lidi do konretních týmů.</mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80a9-9168-f35e464f9ef9" class=""><em><mark class="highlight-pink">A potom si nás vzali rovnou na rok, aby s tím pracovali dlouhodobě, protože jim to dává kontent pro kampaně a navíc upozorňuje když v některém z týmů se něco kazí. </mark></em></p></div></div></details></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">2) Máme vlastní řešení</summary><div class="indented"><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">a) Máme vlastní řešení (typu google forms) </summary><div class="indented"><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8084-9964-fd3dbdba85df" class=""><em><mark class="highlight-default">„Super, že to děláte. Jak vám to dneska funguje? Odpovídají lidi otevřeně, jsou i kritické? Je to anonymní? A jaký držíte response rate?“ </mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-804f-971f-d4ddadb3d5d2" class=""><mark class="highlight-default"><strong>Reakce na CEO : </strong></mark><em><mark class="highlight-default">“Znáte to, vždycky existuje skupina lidí, která nevěří, že je to anonymní a nenapíšou plnou pravdu do firemního formuláře, protože se bojí, že šéf uvidí, kdo co psal. Možná si sám umíte představit, kteří to budou?”</mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-803a-8ff0-f60a75f50349" class=""><mark class="highlight-default">nechej mluvit</mark></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80f5-b007-db565481ac23" class=""><em><mark class="highlight-pink">“Třeba v Expandu si to dříve také posílali přes google forms, a kromě toho, že jim to pokáždé zabralo týden práce, tak i výstupy jim nic moc neříkali na čem pracovat. </mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80b6-b9e9-edc2f525d1bf" class=""><em><mark class="highlight-pink">S Echo pulse zvýšili response rate o 25% a měli výsledky 8x rychleji a mohli to tak posílat každý měsíc, nejen kvartálně jako dříve. Navíc dostali manažeři doporučení, co řešit na 1on1 meetinzích, a na základě toho odhalili tak jeden super potenciál v týmu zákaznického servisu, kdy se z té slečny následně stala dokonce líderka. Bez upozornění by to ten juniorní manažer dlouho přehlížel.”</mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80eb-b57e-d7951ceafeb5" class=""><mark class="highlight-default"><strong>Reakce na HR:</strong></mark><em><mark class="highlight-default"> „My jsme to měli kdysi taky přes Google Forms – nejvíc práce pak bylo s výstupy. Jak je to u vás?“</mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8051-a503-d598260840d3" class=""><mark class="highlight-default">nechej mluvit</mark><div class="indented"><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8033-b186-d4aeffc7682e" class=""><em><mark class="highlight-default"><span style="border-bottom:0.05em solid">„Hlavní důvody proč používat nás a ne si to řešit samostatně jsou tři:</span></mark></em></p></div><div style="display:contents" dir="auto"><ul id="343d8a3f-5e39-8070-9401-dc97e2887a3a" class="bulleted-list"><li style="list-style-type:disc"><mark class="highlight-default"><strong>Vysoká response rate</strong></mark><mark class="highlight-default">: Naše pravidlo 48 hodin a automatizované upomínky zajišťují návratnost </mark><mark class="highlight-default"><strong>přes 85 %</strong></mark><mark class="highlight-default">. Vlastní dotazníky lidé odkládají a po čase na ně přestanou reagovat úplně.</mark></li></ul></div><div style="display:contents" dir="auto"><ul id="343d8a3f-5e39-8003-985e-c961fd79f963" class="bulleted-list"><li style="list-style-type:disc"><mark class="highlight-default"><strong>Dozvíte se pravdu: </strong></mark><mark class="highlight-default">Lidi se více otevřou, protože spíše uvěří anonymitě - tím, že jsme třetí strana (potvrzeno zkušeností.</mark></li></ul></div><div style="display:contents" dir="auto"><ul id="343d8a3f-5e39-804b-a777-cf2b5a9b1a9a" class="bulleted-list"><li style="list-style-type:disc"><mark class="highlight-default"><strong>Ušetřený čas/náklady na práci HR/menší nároky na HR</strong></mark><mark class="highlight-default">: HR s tím nemá žádnou práci, ušetří celý čas co by za tím standardně měla (i lídři už mají data rovnou dostupná)</mark></li></ul></div></div></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80ca-bdff-ed433d35f1f8" class="">Pro šťouraly doplnění:</p></div><div style="display:contents" dir="auto"><ul id="343d8a3f-5e39-8037-94e4-e11f0538a1e3" class="bulleted-list"><li style="list-style-type:disc"><mark class="highlight-default"><strong>Metodická síla (20 tisíc slov, interpretace ticha):</strong></mark><mark class="highlight-default"> Náš analytický model není „obyčejné AI“. V pozadí běží metodické instrukce o obrovském rozsahu, které hlídají psychologickou validitu a trendy. </mark><div style="display:contents" dir="auto"><ul id="343d8a3f-5e39-805c-a87d-c382eaf564c8" class="bulleted-list"><li style="list-style-type:circle"><mark class="highlight-default">Běžné ChatGPT vám otázky sice vyplivne, ale neumí je analyzovat v kontextu vaší historie a byznysových rizik bez halucinací. DIY nástroje měří jen to, co lidé napíšou. Náš vyladěný model dokáže interpretovat i to, co lidé nevyplnili nebo přeskočili („</mark><mark class="highlight-default"><strong>analýza ticha</strong></mark><mark class="highlight-default">“).”</mark></li></ul></div></li></ul></div><div style="display:contents" dir="auto"><ul id="343d8a3f-5e39-80f9-89be-c288e2d2b5f2" class="bulleted-list"><li style="list-style-type:disc"><mark class="highlight-default"><strong>Srovnání se standardy:</strong></mark><mark class="highlight-default"> „Proč používáte Slack/Teams, když si můžete posílat SMS nebo maily? Protože ten proces a prostředí dělají ten rozdíl v efektivitě.“</mark><div style="display:contents" dir="auto"><ul id="343d8a3f-5e39-8002-8360-eb92ca097a63" class="bulleted-list"><li style="list-style-type:circle"><mark class="highlight-default">Když firma nezná slack? Odkaž na jinou analogii - </mark><em><mark class="highlight-default">Proč používáte profi účetní software, když by vám technicky stačil Excel a kalkulačka? Protože chcete mít jistotu v datech, automatizaci a jasný výstup bez chyb. Echo pulse je ten rozdíl mezi &#x27;mít dat</mark></em></li></ul></div></li></ul></div><div style="display:contents" dir="auto"><ul id="630c89ea-194e-46c9-9fb7-5dcc56b9a411" class="bulleted-list"><li style="list-style-type:disc">Pokud se engagement zvedne jen o 1 %, investice se zaplatí za 6 dní. Více v <mark class="highlight-orange"><a href="https://www.notion.so/8-Handbook-ROI-calculator-2dcd8a3f5e39804c91aeee33beddfb1a?pvs=21">ROI sekci</a></mark></li></ul></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">b) My si to spíš navibekodíme</summary><div class="indented"><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8058-8724-c84628b2e6ed" class=""><em>“Je super, že chcete se zpětnou vazbou pracovat, ale důležité je to nepodcenit. </em><em><mark class="highlight-default">Jasně, </mark></em><em><mark class="highlight-default"><strong>můžete si dělat vlastní dotazník</strong></mark></em><em><mark class="highlight-default">. </mark></em><em><mark class="highlight-default"><strong>Otázky vám AI vygeneruje za chvíli.</strong></mark></em><em><mark class="highlight-default"> Ale co s nimi budete dělat dál, a jaké budete mít výstupy? </mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8008-988f-d833f30c7a1c" class=""><em>Klidně to zkuste, a dejte nám vědět, jak to šlo. Je ale třeba si uvědomit, že to </em><em><strong>není jen o sběru otázek, je to o pravidelné distribuci, připomínání, udržování.</strong></em><em> Lehce se stane </em><em><strong>chyba</strong></em><em> v kodu nebo integraci a najednou </em><em><strong>výstupy nedávají smysl.</strong></em><em> </em><em><strong>O to vše se my staráme za vás. </strong></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-803a-915d-c30b00d8079c" class=""><em>I k samotné metodologii, ne každá otázka a odpověď má stejnou váhu. Když máte odpovědi, víte, co vám lidé říkají, ale nevíte nutně, co to pro vás znamená - respektive vaši manažeři to neví. </em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-802c-9849-fbcf8954bc56" class=""><em>My </em><em><strong>dáváme nejen vám přehled, ale taky manažerům do rukou i přímé podněty k akci. Echo pulse je nastavený tak, aby aby se zlepšovali, jako lídři. </strong></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8045-a54e-f884c5a59b85" class=""><em><mark class="highlight-pink">“Třeba v Expandu zkoušeli vlastní řešení, ale pokáždé jim to zabralo týden práce - výstupy byly data, ale nevěděli hned co s nimi, museli se scházet a vytvářet akční plán. </mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8010-9eb5-f264f90af4ae" class=""><em><mark class="highlight-pink">S Echo pulse měli výsledky 8x rychleji a mohli to tak posílat každý měsíc, nejen kvartálně jako dříve. Navíc dostali manažeři doporučení, co řešit na 1on1 meetinzích, a na základě toho odhalili jeden super potenciál v týmu zákaznického servisu, kdy se z té slečny následně stala dokonce líderka. Bez upozornění by to ten juniorní manažer dlouho přehlížel.”</mark></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8019-a8ca-df48cab962c9" class=""><em>A v neposlední řadě - jako třetí strana jsme pro lidi důvěryhodnější. Spíše nám řeknou pravdu, a nebudou odpovědi stylizovat pro vedení. “</em></p></div></div></details></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">3) Máme problémy, potřebujeme to řešit, ne zjišťovat</summary><div class="indented"><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">a) Víme, že máme problémy, ale nic s tím neuděláme, tak se radši neptejme</summary><div class="indented"><div style="display:contents" dir="auto"><p id="3d0f0e49-39b3-4cb2-a299-b2d25c2a88f1" class=""><em>„Rozumím – takže problém není, že byste nevěděli, co lidi trápí, ale že nemáte kapacitu reagovat na všechno.“</em></p></div><div style="display:contents" dir="auto"><p id="77758c9a-9566-46e8-86df-80c883f28ee5" class=""><em>„A pak je otázka – jak dnes poznáte, co je opravdu kritické a co může počkat, nebo se jen lépe vysvětlit?</em></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-80b8-8605-e410cf49299b"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8048-81b9-e3a22e99673e" class=""><strong>Zákazník typicky řekne: </strong>podle manažerů / podle urgencí </p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-8083-8084-c5ec9c6223e4"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80de-9a99-f83a53eb98c4" class=""><em>„Chápu. A právě v tomhle bývá často problém, že se nakonec řeší to, co je nejvíc slyšet, ne to, co má největší dopad.“</em></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8039-bbc5-c83c712bbb83" class=""><em>„My pomáháme dát tomu jednoduchou prioritu, aby bylo jasné, co řešit hned a co může počkat.“</em></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80bb-a677-ca94df0d4e4f" class=""><em>„Chcete, abych vám ukázal, jak tohle vypadá u jiných týmů v podobné situaci?“</em></p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">b) Zpětnou vazbu už máme a víme, co lidi pálí, takže nechceme sbírat další feedback.</summary><div class="indented"><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80c3-8f1b-fe076e24704f" class="">(řešení: doporučení k akci + sledování trendu)</p></div><div style="display:contents" dir="auto"><p id="bf06127a-6707-4747-a964-ccc763a31061" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><ol type="1" id="332d8a3f-5e39-8042-940b-ee7848d5cdcf" class="numbered-list" start="1"><li><em>“Super. A co jste zjistili? Už víte, jak s tím budete pracovat?“</em></li></ol></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80d0-a973-c13e09d15a3a" class="">Častá odpověď od zákazníka je, že si na to budou potřebovat sednout s lídry a probrat, co prioritizovat, a že řada věcí změnit stejně nejde. </p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80b4-afcf-f6e46a18fd4e" class=""><em>„Protože tohle vidíme často. Firmy mají dobrý přehled o problémech, ale </em><em><strong>zaseknou se mezi tím vědět a něco skutečně změnit.</strong></em><em>“</em></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80d5-9a0f-fa019f3324f8" class=""><em>“My nedáváme jen insight typu ‘komunikace je slabá’, ale rovnou i kde přesně se to děje - ve kterých týmech je problém největší, a rovnou podle priority říkáme, </em><em><strong>co s tím jde dělat - včetně malých kroků, které lidi povzbudí, </strong></em><em>i když třeba nevyřeší hned core problému. “</em></p></div><div style="display:contents" dir="auto"><ol type="1" id="332d8a3f-5e39-8012-92a3-e9e5ea174d2e" class="numbered-list" start="2"><li><em>“A když teď víte, co je problém, a začnete ho řešit, </em><em><strong>jak budete zjišťovat, jestli se to daří zlepšovat, nebo ne? </strong></em></li></ol></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80c3-9c62-dcc748c53570" class="">Toto je velmi dobrý point, na který reaguje každá firma, se kterou se bavíme. Protože tento druhý krok zpravidla firma nemá vyřešený. Přitom sledovat trend je to nejdůležitější. Potřebují vědět, jaké mají implementované změny dopad.</p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">c) Teď se věci hodně mění, vyřešíme to pak</summary><div class="indented"><div style="display:contents" dir="auto"><p id="5f1c6278-bc66-4034-a21a-0d60bb038581" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="c0196e0b-fa35-414e-a153-0b1228958d0a" class=""><em>„A jak si dneska během té transformace ověřujete, že to lidé v týmech skutečně berou a funguje to tak, jak potřebujete?“</em></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-8017-b9c6-d2b3c6b992fd"/></div><div style="display:contents" dir="auto"><p id="0e3ec9bf-381b-4dc3-9385-786460baa8c8" class=""><strong>zákazník typicky řekne něco jako: </strong>No… máme feedback od lidí / manažerů / řešíme to na 1:1 / poradách</p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-808d-9e81-e1b17ce91811"/></div><div style="display:contents" dir="auto"><p id="0ca48870-0822-4706-8c72-098dc7f72180" class=""><em>„Jsou na tom některé týmy lépe než jiné?”</em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-808a-8107-c3288ed09ce6" class="">pausa</p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80ca-85e9-c1b4e84c8c74" class=""><em>„To je přesně ten moment, který řešíme. Ukážeme vám, kteří manažeři a jejich týmy mají se změnou největší problém - většinou je to o komunikaci. Budete vědět, na koho se zaměřit, aby zbytečně nebublal nějaký toxický problém“</em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8081-9dd3-e388d4c3cf73" class=""><em>“Taky si pak můžete hezky sledovat, jak se vyvijí. Pokud je v týmu problém, vy ho věříte s manažerem vyřešíte, v dalším měsící si to hned hezky ověříte.”</em></p></div></div></details></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">4) Je to fajn, ale teď řešíme jiné priority</summary><div class="indented"><div style="display:contents" dir="auto"><p id="afc43b2b-1873-4349-91d0-640d61ab1d1f" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="05a3f06c-e939-4745-acd1-f6c4356fb2ee" class=""><em>„Rozumím. Většina firem je teď pod tlakem a řeší důležitější věci než další nástroj.“</em></p></div><div style="display:contents" dir="auto"><p id="80a07659-dda2-4053-a062-c50ad455f8fd" class="">(pause – ať to dolehne)</p></div><div style="display:contents" dir="auto"><p id="f9b7abba-0d11-4d8c-83fc-dc192a3aaf71" class=""><em>„Můžu se zeptat – co vám teď osobně bere nejvíc času nebo energie? Je to výkon některých týmů? Prodeje?</em></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-8079-acbd-e35ff19a7b25"/></div><div style="display:contents" dir="auto"><p id="22c12121-4022-4b7d-bef7-f0ff5c5f82a8" class=""><strong>Zákazník typicky řekně něco jako</strong>: „řešíme výkon, obchod, transformaci, hledáme nové talenty“</p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-80b9-a53d-c37f221b3e17"/></div><div style="display:contents" dir="auto"><p id="6be779b0-6f6e-4707-a287-4b5ef1bf0834" class=""><em>„A jak velkou roli v tom hrají lidi nebo fungování týmů?“</em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-80ed-92c1-eee6c9e11f6f" class=""><strong>Zákazník typicy řekne </strong>“no asi velkou :)”</p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-809a-adee-db7e544a3d06" class=""><em>“Přesně, neptám se, abych vás nachytal, ale proto, že přesně na toto je náš nástroj. Protože díky echo pulse </em><em><strong>získáte přehled, kteří manažeři jsou lepší, kteří horší a uvidíte dynamiku v týmech</strong></em><em>. Dá vám to další perspektivu, díky které pochopíte proč některé týmy pracují líp a co brzdí výkon, aniž byste museli spoléhat na to, co vám říkají jedinci.</em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8050-b407-dd419eb9ce6d" class=""><em>Ale co více, hlavně dáváme i manažerům přímo doporučení, co dělat. </em><em><strong>Dáme jim podklady a podněty co s lidmi řešit na poradách, nebo na one on ones. A díky tomu se i z manažerů stávájí lepší lídři.</strong></em></p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-802f-bddb-c07c87960453" class="">pausa</p></div><div style="display:contents" dir="auto"><p id="343d8a3f-5e39-8052-a748-de7806061ee3" class=""><em>Asi se chcete zeptat, jak to děláme. Posilame 2min dotaznicek, ktery za 90 vteřin se zeptá lidí na věci které odhalí ty mezery. K vám se dostanou hlavní priority, a ke každému manažerovy jeho priority a doporučení. </em></p></div></div></details></div></div></figure></div><div style="display:contents" dir="ltr"><figure class="block-color-purple_background callout" style="white-space:pre-wrap;display:flex" id="e0234a5c-32e5-48c3-8c7c-6e9893268a38"><div style="font-size:1.5em"><span class="icon">🧪</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h2 id="af2b5278-0056-49ed-8c4c-d425cfbe16c9" class="">Metodologie a důvěra v data (četnost, anonymita, otázky, AI)</h2></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">13) 1× za měsíc je moc často</summary><div class="indented"><div style="display:contents" dir="auto"><ul id="7be99e20-559c-4077-9b1f-d45d16dc242f" class="bulleted-list"><li style="list-style-type:disc">Bojí se <strong>únavy lidí</strong>.</li></ul></div><div style="display:contents" dir="auto"><ul id="332d8a3f-5e39-8054-839f-db0a306c8d58" class="bulleted-list"><li style="list-style-type:disc">Má zkušenost, že iniciativy časem „vyšumí“.</li></ul></div><div style="display:contents" dir="auto"><ul id="332d8a3f-5e39-80eb-a349-fd348a23e330" class="bulleted-list"><li style="list-style-type:disc">Myslí v blocích (kvartál, rok), ne v rytmu.</li></ul></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8005-8640-c6ae3d621940" class="">
</p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80dd-8d46-c807c6a4b28a" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80b2-854a-f782ce16495b" class=""><em><mark class="highlight-purple">„Jak často se u vás dnes dozvíte, že něco nefunguje – ještě včas, nebo až když je z toho problém?“</mark></em></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8036-bf9d-f2338bb1147f" class=""><em>nech odpovědět</em></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80b1-8ee8-c4cd19850f34" class="">
</p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80e9-8927-cf07b13af644" class=""><strong>Follow-up:</strong></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-809c-afe8-f9c87cf2ef37" class=""><em><mark class="highlight-purple">„Kdyby vám něco malé jednou za měsíc ukázalo, že se to začíná lámat – bylo by to užitečné?“</mark></em></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8094-87d4-f581cf39616a" class="">Ano, tohle je jedna z nejčastějších reakcí, kterou dostáváme. Na západě už je dneska uplný standard posílat to měsíčně. Svět se zrychluje  - nebo máte pocit, že se zpomaluje? 🙂 Čím rychleji jde info správným směrem, tím rychleji firmy regagují. </p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-801f-a909-c5a2e7f8c867" class="">Např. přesně Průša 3D tisk, to jistě znáte, jsme přesvědčili, ať to vyzkouší měsíčně a byli výsledky totálně zaskočeni. Dostali insights, které teamy mají vyhodit jako první. A to také, jak jistě víte z tisku, udělali. </p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-808e-b64d-eb1fd6aa8837" class=""><strong>Teprve pak (fakticky, bez tlaku):</strong></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8067-86b1-fac97a0d9a47" class=""><em><mark class="highlight-purple">„Měsíc doporučujeme kvůli tomu, aby šlo reagovat dřív, než z malých věcí vzniknou výpovědi.&quot;</mark></em></p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">14) Nechci to anonymní</summary><div class="indented"><div style="display:contents" dir="auto"><ul id="5423aeb2-bc2f-467b-b3d9-12c4f0e82ae7" class="bulleted-list"><li style="list-style-type:disc">Chce <strong>kontrolu a odpovědnost</strong>.</li></ul></div><div style="display:contents" dir="auto"><ul id="cfd464c4-5123-484a-ac7a-91b0b4b487a6" class="bulleted-list"><li style="list-style-type:disc">Věří, že otevřenost = dospělost kultury.</li></ul></div><div style="display:contents" dir="auto"><ul id="31a63633-55e5-40d4-904f-751b70cd72d4" class="bulleted-list"><li style="list-style-type:disc">Podceňuje <strong>mocenskou asymetrii</strong> (šéf vs. zaměstnanec).</li></ul></div><div style="display:contents" dir="auto"><p id="6173b2da-9a7b-4519-9535-295f1abf8f92" class="">
</p></div><div style="display:contents" dir="auto"><p id="181a1ae7-56c4-4706-ae63-76af0d5c7ec4" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="c7947d95-4bde-49ae-b863-c4dc902a6bf6" class=""><em><mark class="highlight-purple">„To dává smysl. Můžu se zeptat – když u vás někdo nesouhlasí s rozhodnutím vedení, řekne to bez obav otevřeně?“</mark></em></p></div><div style="display:contents" dir="auto"><p id="ffd05ae9-1bc5-43e4-9f2b-bf2b46c24ddd" class=""><em>nech odpovědět</em></p></div><div style="display:contents" dir="auto"><p id="7d2bf3aa-241d-4a13-9329-2f531bbefecf" class="">
</p></div><div style="display:contents" dir="auto"><p id="c4148b5a-9e50-4dbf-b846-20f4104ed5f8" class=""><strong>Follow-up:</strong></p></div><div style="display:contents" dir="auto"><p id="5d3c3f40-29ca-4c9e-a856-99fcfa87eff3" class=""><mark class="highlight-purple">„A myslíte, že by totéž řekl i tehdy, kdyby se to týkalo jeho přímého nadřízeného?“</mark></p></div><div style="display:contents" dir="auto"><p id="d056fc33-23af-4626-b7b8-ca1745dca77a" class="">
</p></div><div style="display:contents" dir="auto"><p id="16af375e-bf5b-4941-8608-bc21f7994c9d" class=""><strong>Teprve pak (jedna věta, klidně):</strong></p></div><div style="display:contents" dir="auto"><p id="fde6cfbd-0017-4181-883a-1f4e2a10d236" class=""><mark class="highlight-purple">„Anonymita u nás není o schovávání se, ale o tom, aby se objevily věci, které by jinak nezazněly vůbec.&quot;</mark></p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">15) Přijde mi to generické</summary><div class="indented"><div style="display:contents" dir="auto"><ul id="b45b2f10-f2e3-4e21-8d76-a00b4888199f" class="bulleted-list"><li style="list-style-type:disc">Má pocit, že <strong>jejich firma je specifická</strong>.</li></ul></div><div style="display:contents" dir="auto"><ul id="b6ff4d14-d748-4e93-a3ae-ef604b7e0592" class="bulleted-list"><li style="list-style-type:disc">Bojí se HR šablon a „dotazníkové únavy“.</li></ul></div><div style="display:contents" dir="auto"><ul id="cc24c63e-6334-4b8d-8e1d-b2908023a192" class="bulleted-list"><li style="list-style-type:disc">Chce <strong>konkrétní relevance</strong>, ne obecné pravdy.</li></ul></div><div style="display:contents" dir="auto"><p id="786573b2-6944-4d1f-adb6-6ab93a279f7c" class="">
</p></div><div style="display:contents" dir="auto"><p id="4c77ec5f-bf55-43fd-9caf-993e62141ec9" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="fe5728a4-7806-4d52-8c62-1349c1430aca" class=""><em><mark class="highlight-purple">„Co konkrétně by pro vás bylo známkou, že je to relevantní právě pro vaši firmu?“</mark></em></p></div><div style="display:contents" dir="auto"><p id="6a2e0387-29cd-4760-82b3-9069fd340982" class=""><em>poslouchat</em></p></div><div style="display:contents" dir="auto"><p id="328f8a48-0b01-43b0-ad7c-57b0098c9862" class="">
</p></div><div style="display:contents" dir="auto"><p id="6928e64a-4405-4bbf-a418-cb9b6d967b87" class=""><strong>Follow-up:</strong></p></div><div style="display:contents" dir="auto"><p id="5987a1e3-c10a-4d57-b3b8-f807ddc41341" class=""><em><mark class="highlight-purple">„Je to spíš jazyk otázek, témata, nebo to, co z těch dat dostanete ven?“</mark></em></p></div><div style="display:contents" dir="auto"><p id="16817484-a503-4719-8cfe-a2df9ee21322" class="">
</p></div><div style="display:contents" dir="auto"><p id="98f4edae-b715-4df0-906f-d5fef08f93d4" class=""><strong>Teprve potom krátký reframe:</strong></p></div><div style="display:contents" dir="auto"><p id="890bb2c9-db5a-42ce-8dd8-ece3dfe8e249" class=""><mark class="highlight-purple">„Dotazník je stejný, aby šel porovnávat v čase. To, co je unikátní, jsou vzorce chování vašich týmů – ty generické nikdy nejsou.&quot;</mark></p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">16) Otázky jsou fixní? / Chci vlastní otázky</summary><div class="indented"><div style="display:contents" dir="auto"><p id="8a9885d6-f930-464f-8e25-d8fc89309f03" class="">Je třeba pochopit důvod kontroly</p></div><div style="display:contents" dir="auto"><p id="0176edc5-2977-4fda-a692-a37480e5cf17" class="">
</p></div><div style="display:contents" dir="auto"><p id="08eaf365-c8c5-41f6-b6f0-b9b6baf6f2b7" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="dbcec25a-9094-4d50-8aaf-77a8581ff548" class=""><em><mark class="highlight-purple">„Co konkrétně byste se potřebovala zeptat, aby vám to dneska dávalo smysl?“</mark></em></p></div><div style="display:contents" dir="auto"><p id="e2a2a888-169d-4dc0-923d-5e03d68c13f8" class=""><em>poslouchat</em></p></div><div style="display:contents" dir="auto"><p id="7cb277a3-aad8-457c-bdde-a7eee0bda0bd" class="">
</p></div><div style="display:contents" dir="auto"><p id="abf68667-db2f-4abe-8779-12b77c5ea735" class=""><strong>Teprve pak krátký reframe:</strong></p></div><div style="display:contents" dir="auto"><p id="76930e53-47bb-4e1d-96ff-517ccde6d6aa" class=""><em><mark class="highlight-purple">„Ptám se proto, že náš cíl není jednorázová odpověď, ale trend v čase.&quot;</mark></em></p></div><div style="display:contents" dir="auto"><p id="5e574bdb-c527-4f00-baa1-f8ca9de24760" class=""><em><mark class="highlight-purple">„Ty otázky nejsou náhodné. Jsou otestované tak, aby lidé skutečně odpovídali – a to je důležitější než dokonalá formulace.&quot;</mark></em></p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">17) Každý chce víc peněz</summary><div class="indented"><div style="display:contents" dir="auto"><ul id="e6d8019d-8f05-4d46-8574-44e3625e8d5f" class="bulleted-list"><li style="list-style-type:disc"><em><mark class="highlight-purple">Ano, je to jak říkáte, to lidé tvrdí. Ale za požadavkem na peníze často stojí jiné překážky: stres, chaos v procesech nebo špatné nástroje.</mark></em></li></ul></div><div style="display:contents" dir="auto"><ul id="f08aa049-973d-4974-98e5-71f5ce374ba8" class="bulleted-list"><li style="list-style-type:disc"><em><mark class="highlight-purple">Echo Pulse odfiltruje „stížnosti na plat“ a ukáže vám skutečné bariéry výkonu, které můžete vyřešit i bez navyšování rozpočtu.</mark></em></li></ul></div></div></details></div></div></figure></div><div style="display:contents" dir="ltr"><figure class="block-color-orange_background callout" style="white-space:pre-wrap;display:flex" id="86fdb4cd-c7a2-4665-aa6b-224e78704cec"><div style="font-size:1.5em"><span class="icon">💸</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h2 id="010134a1-5854-4903-af1a-6c2659d42d62" class="">Cena (drahé, ROI, návratnost)</h2></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">20) Nevím, jestli se nám vyplatí do toho investovat (ROI)</summary><div class="indented"><div style="display:contents" dir="auto"><p id="47baf13d-d033-4992-ab64-b3f7a04b7239" class=""><strong>Reakce (klidně, bez tlaku):</strong></p></div><div style="display:contents" dir="auto"><p id="a82a9945-1d16-42c7-bb0f-33bb35ba7a52" class="">„Dává smysl. Můžu jen dát rychlý rámec, jak se na to díváme?“</p></div><div style="display:contents" dir="auto"><p id="a34a68db-1c9f-4225-93b9-b4d73d19b628" class="">(pause)</p></div><div style="display:contents" dir="auto"><p id="f2f21312-4b84-4de8-9e40-3b4e05e666c2" class="">„Vy dneska dáváte typicky kolem <strong>desítek tisíc měsíčně do jednoho člověka</strong>. Echo je <strong>99 Kč na hlavu měsíčně</strong>. To je zhruba <strong>0,1 %</strong> té investice.“</p></div><div style="display:contents" dir="auto"><p id="39b5da4b-984c-440f-9dbe-ad976478b9b2" class="">
</p></div><div style="display:contents" dir="auto"><p id="2e3ca68c-9d24-4eb3-86e6-a9fc3887a646" class="">„A ta otázka pak zní: <em>Chcete investovat 99 Kč, aby vám zbytečně neutekl člověk, do kterého každý měsíc dáváte desítky tisíc?</em>“</p></div><div style="display:contents" dir="auto"><p id="e35ee133-8bbd-4a2c-a5ae-56d538354789" class="">
</p></div><div style="display:contents" dir="auto"><p id="553dc9d8-65d7-4f13-b181-9dc2bef564e4" class=""><strong>Mini break-even (1 věta):</strong></p></div><div style="display:contents" dir="auto"><p id="8b4d0434-13e5-47bf-aefa-e88f960c52de" class="">„Náklad na odchod jednoho člověka bývá klidně kolem <strong>600 000 Kč</strong>. Když vám Echo pomůže udržet <strong>jednoho člověka za rok</strong>, typicky je zaplaceno na roky dopředu.“</p></div><div style="display:contents" dir="auto"><p id="b81e8d06-20f3-484f-a1a0-43a706c48226" class="">
</p></div><div style="display:contents" dir="auto"><p id="749a1830-f07a-4ab6-97c0-40445002bca5" class=""><strong>Live kalkulačka – 2 otázky (a pak ticho):</strong></p></div><div style="display:contents" dir="auto"><ol type="1" id="92b4a630-d8b6-46a5-b8d1-535239cfdd68" class="numbered-list" start="1"><li>„Jaká je u vás průměrná hrubá mzda u lidí, o které nechcete přijít?“</li></ol></div><div style="display:contents" dir="auto"><ol type="1" id="9f4f094a-8bd9-4dc1-ba0f-8baaeafa9d4c" class="numbered-list" start="2"><li>„Kolik takových lidí vám za poslední rok odešlo / dalo výpověď?“</li></ol></div><div style="display:contents" dir="auto"><p id="5a4a49f0-c01c-441e-85da-cae2efd59b9a" class="">
</p></div><div style="display:contents" dir="auto"><p id="12cd2c96-8d97-48cd-96a4-47f6eb13934a" class=""><strong>Zakončení:</strong></p></div><div style="display:contents" dir="auto"><p id="2bf9350a-c41a-4f81-97a6-3c8c5a15dbaa" class="">„Když si dáme dohromady tyhle dvě čísla, dá se během minuty říct, jestli má Echo smysl řešit, nebo ne.“</p></div></div></details></div></div></figure></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="125c16c9-2cad-4214-8eef-c1a2a2873af5"><div style="font-size:1.5em"><span class="icon">🧭</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h2 id="6a2487ef-4ccf-4219-8e65-95a21809e35b" class="">Closing námitky (konverzní překážky: rozhodování, budget, priority, next step)</h2></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">21) Nemáme na to teď budget</summary><div class="indented"><div style="display:contents" dir="auto"><p id="bf3de2e5-5ffb-4abf-9e34-71a76d2c5570" class=""><strong>Validace bez tlaku:</strong></p></div><div style="display:contents" dir="auto"><p id="e401d783-2bbd-448e-8df2-0da7302183ca" class="">„Chápu. Většina firem má rozpočet na tenhle rok už daný.“</p></div><div style="display:contents" dir="auto"><p id="42558db3-61a7-4e75-9992-f3d322fd78be" class="">(pause)</p></div><div style="display:contents" dir="auto"><p id="d1b98b73-ab10-4dec-b2dc-fa3095a1be10" class="">
</p></div><div style="display:contents" dir="auto"><p id="172386f4-11f8-4f1e-8bdf-6ecb0f2d76b8" class=""><strong>Ověření reality – jemná otázka:</strong></p></div><div style="display:contents" dir="auto"><p id="2a8b027d-1121-40ab-a609-15e61ee60d2a" class="">„Je to spíš o tom, že rozpočet už je alokovaný, nebo že teď nevidíte dostatečný důvod ho otevřít?“</p></div><div style="display:contents" dir="auto"><p id="a96119a6-a87f-4810-93d4-522f289448bd" class="">
</p></div><div style="display:contents" dir="auto"><p id="1b1e7eea-f2ab-48c0-9537-237f7cf27f9d" class=""><strong>Když je to opravdu rozpočet (neargumentuj, mapuj):</strong></p></div><div style="display:contents" dir="auto"><p id="ad72aa19-8bea-4f96-958c-f8241adc0c48" class="">„Jak u vás obvykle vzniká prostor pro nové věci? Je to přes HR, vedení, nebo až při plánování dalšího období?“</p></div><div style="display:contents" dir="auto"><p id="7ce8b0bc-da15-4cce-8b9b-f69dbc8b2d79" class="">
</p></div><div style="display:contents" dir="auto"><p id="10d332ed-d4ec-4a3a-aa2e-2feaa5a141dd" class=""><strong>Nabídni cestu, ne tlak:</strong></p></div><div style="display:contents" dir="auto"><p id="1b7669e5-a1f1-4268-b622-d06211cba468" class="">„Možná teď není správná chvíle na plné rozhodnutí. Dávalo by smysl se bavit spíš o malém pilotu, nebo se k tomu vrátit v konkrétním termínu?“</p></div><div style="display:contents" dir="auto"><p id="6686ec69-9151-40bb-aad8-c62eef43f321" class="">
</p></div><div style="display:contents" dir="auto"><p id="0f3f3191-470d-4472-b983-daf8e40aa311" class=""><strong>Když je to spíš hodnota/priorita (krátký reframe):</strong></p></div><div style="display:contents" dir="auto"><p id="319111b6-6f7e-49d1-928f-7a77b164855a" class="">„Echo Pulse většinou nekupují firmy proto, že mají přebytek peněz. Kupují ho proto, že chtějí dřív vidět věci, které by je stály víc později.“</p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">22) Potřebuju to probrat s týmem / majitelem</summary><div class="indented"><div style="display:contents" dir="auto"><p id="13a3063f-ce58-4af3-abcd-037e2c12203c" class=""><strong>Odhal, jestli je to výmluva:</strong></p></div><div style="display:contents" dir="auto"><p id="ff0bf3b9-3cd1-4bd8-8495-f27cb9af8f3f" class="">„Vám za vás to dává smysl a chcete to?“</p></div><div style="display:contents" dir="auto"><p id="2b381e07-8f96-4e75-8d75-d1c4c891a48e" class="">
</p></div><div style="display:contents" dir="auto"><p id="aa632d53-bf9d-43d8-96cd-3c5b07682e90" class=""><strong>Zmapuj decision makera:</strong></p></div><div style="display:contents" dir="auto"><p id="b6f464b4-43ca-4bb8-9640-ed51f8d969e0" class="">„S kým to budete probírat? Kdo o tom na konci dne rozhoduje?“</p></div><div style="display:contents" dir="auto"><p id="0eecfec3-15d5-4588-96fa-e701aca76089" class="">
</p></div><div style="display:contents" dir="auto"><p id="41afa9ac-23fa-47a9-8c11-befc555a1fcf" class=""><strong>Argument paměti (jemně, ale přímo):</strong></p></div><div style="display:contents" dir="auto"><p id="8bf7d53c-79dd-413a-9d1c-dbcaf3b5bbd9" class="">„Teď jste přesvědčení a máte v hlavě 100 %. Cestou z práce 50 %, zítra 20 %. A přesně tak to pak předáte dál. Nebylo by lepší to probrat spolu rovnou s nimi?“</p></div><div style="display:contents" dir="auto"><p id="3b59e8e9-73c1-4a4c-8778-fac5b09c6284" class="">
</p></div><div style="display:contents" dir="auto"><p id="4e74619c-78a1-4a45-b2ec-02f63c0ad886" class=""><strong>Konkrétní next step:</strong></p></div><div style="display:contents" dir="auto"><p id="8a7c013b-a34f-4700-a67c-807f57199b09" class="">„Pojďme jim to ukázat spolu. Můžeme jim rovnou zavolat, nebo naplánovat krátký 20min slot tento týden.“</p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">23) Nejsem decision maker</summary><div class="indented"><div style="display:contents" dir="auto"><p id="a9ec66c9-5e6e-43c7-a59f-d5d29a6581ff" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="ff50b677-17de-4387-8140-f4f222ba5bbb" class="">„Rozumím. Jak u vás typicky vypadá rozhodování u podobných nástrojů? Kdo je do toho zapojený?“</p></div><div style="display:contents" dir="auto"><p id="44be5e59-08af-469a-96a0-c14b4f308ad4" class="">(pause)</p></div><div style="display:contents" dir="auto"><p id="6229596d-8a43-4662-8d6e-e13d5aa9314b" class="">„Dává smysl se na to podívat spolu a případně pak zapojit správné lidi? Nebo je lepší jít rovnou přes ně?“</p></div><div style="display:contents" dir="auto"><p id="6c1d5881-82d0-43e5-a39c-08a6b825a240" class="">
</p></div><div style="display:contents" dir="auto"><p id="3cad4bbc-4992-4225-a3ea-141daf1a8171" class=""><strong>Pointa:</strong></p></div><div style="display:contents" dir="auto"><p id="bd6ab9e9-9055-4a78-9bc0-12103c7d0082" class="">👉 mapovat proces</p></div><div style="display:contents" dir="auto"><p id="cd13769f-6f71-4234-a25f-87e038bfdbde" class="">👉 dostat se k reálnému buyerovi</p></div><div style="display:contents" dir="auto"><p id="4dfb9838-2249-4bb7-b1fb-429ee1de0924" class="">👉 neprezentovat „naprázdno&quot;</p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">24) Jsme globální / řeší se to z centrály v zahraničí</summary><div class="indented"><div style="display:contents" dir="auto"><p id="f194b9cc-f578-416a-9d4d-7db174058cbb" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="ed53c946-4ab1-4bb4-9f01-3d92157b4fbe" class="">„Rozumím – to znamená, že většina nástrojů je daná centrálně. Máte ale prostor řešit některé věci lokálně, třeba na úrovni týmů nebo pilotů?“</p></div><div style="display:contents" dir="auto"><p id="ca55d555-9bb6-4c17-bf19-8ea259f5f4ee" class="">(pause)</p></div><div style="display:contents" dir="auto"><p id="9ea4686c-edff-4507-ae81-4c297a746413" class="">„Ptám se, protože často dává smysl začít malým use casem lokálně a až pak to případně škálovat.“</p></div><div style="display:contents" dir="auto"><p id="557d25b0-9e52-46f7-b32c-3fa79d60ff8a" class="">
</p></div><div style="display:contents" dir="auto"><p id="f2677e14-c498-4719-ba5b-a0753c7b5236" class=""><strong>Pointa:</strong></p></div><div style="display:contents" dir="auto"><p id="3e72f372-18b9-4a2a-aa82-40d1df26aaed" class="">👉 hledat „entry point&quot;</p></div><div style="display:contents" dir="auto"><p id="031cce14-0361-42af-af32-ee31d9181b8c" class="">👉 pilot místo full rolloutu</p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">25) Closing – rychlé testy, jestli je to překážka nebo výmluva</summary><div class="indented"><div style="display:contents" dir="auto"><p id="2138c424-b3ed-41d9-9e3e-f1b4025b712a" class=""><strong>Test 1 – Otoč dynamiku na využití:</strong></p></div><div style="display:contents" dir="auto"><p id="80d91ec7-f22d-4c63-8645-f04e97c0db03" class="">„Zapomeňme na chvíli na překážky. Jak konkrétně byste to ve firmě využili? Kde by to sedělo?“</p></div><div style="display:contents" dir="auto"><p id="24440001-8775-4dcf-bdf1-6e8c9ead5a8b" class="">
</p></div><div style="display:contents" dir="auto"><p id="e4a20c25-ffad-4a7b-a788-98336444418c" class=""><strong>Test 2 – Validuj a zúž:</strong></p></div><div style="display:contents" dir="auto"><p id="0b6bd136-d29c-4c43-8f16-b2664a218b2b" class="">„Je to tedy skutečně o ceně/budgetu, nebo spíš o časování a prioritách?“</p></div><div style="display:contents" dir="auto"><p id="a59c66bc-e451-42b7-8fa7-0e916433f6fe" class="">
</p></div><div style="display:contents" dir="auto"><p id="312ee17e-0b8d-46bd-954d-257091c28749" class=""><strong>Test 3 – Kontrafakt:</strong></p></div><div style="display:contents" dir="auto"><p id="ffd9bd5e-9431-40d1-9932-b86409298f6e" class="">„Představte si, že tohle není překážka. Co by byl váš další krok?“</p></div></div></details></div></div></figure></div><div style="display:contents" dir="ltr"><figure class="block-color-teal_background callout" style="white-space:pre-wrap;display:flex" id="77d3f227-a219-47c2-b2b7-72cf8c85b610"><div style="font-size:1.5em"><span class="icon">📦</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h2 id="710a5883-1a0f-499f-ac46-5e366e3c92d3" class="">Implementace (adopce, logistika)</h2></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">26) Jak nejdýl to používá už nějaký váš zákazník?</summary><div class="indented"><div style="display:contents" dir="auto"><p id="b43fb5b6-b740-48b3-82e1-3239e25005a2" class=""><strong>Reakce (krátká, jistá):</strong></p></div><div style="display:contents" dir="auto"><p id="8c0dbe5d-1eab-4540-ba30-ad79a51600f0" class=""><em><mark class="highlight-purple">„Ano. Máme firmy, které na tom běží </mark></em><em><mark class="highlight-purple"><strong>7+ měsíců</strong></mark></em><em><mark class="highlight-purple"> a u nich je vidět přesně ten efekt: </mark></em><em><mark class="highlight-purple"><strong>po prvním kole drobný propad, pak stabilizace a postupně růst</strong></mark></em><em><mark class="highlight-purple">, když s tím vedení aktivně pracuje. A je normální, že to </mark></em><em><mark class="highlight-purple"><strong>sezónně kolísá</strong></mark></em><em><mark class="highlight-purple"> – třeba podle dovolených nebo špiček. Důležité je, že dlouhodobý trend u firem, kde se to dobře komunikuje, bývá pozitivní.&quot;</mark></em></p></div><div style="display:contents" dir="auto"><p id="c3f3582f-2364-403d-87e1-22fb3cd92703" class="">
</p></div><div style="display:contents" dir="auto"><p id="b741c1f4-b7e4-4529-a3b1-1fcba3f190d4" class=""><em><mark class="highlight-purple"><strong>Doplnění (když chtějí „proč“):</strong></mark></em></p></div><div style="display:contents" dir="auto"><p id="415e7a95-9d08-4c62-aeec-1a916733910d" class=""><em><mark class="highlight-purple">„Protože to není ‘průzkum’. Je to pravidelný radar. A radar funguje, když podle něj občas uděláte malý manévr – ne když jen sbíráte data.&quot;</mark></em></p></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">27) Lidi nemají pracovní e-maily</summary><div class="indented"><div style="display:contents" dir="auto"><p id="64e26e3d-3989-4bbe-a367-b42358f2acff" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><ul id="5a3462fa-921f-4ade-b4d0-fe8c32443d80" class="bulleted-list"><li style="list-style-type:disc"><em><mark class="highlight-purple">„Koho byste dnes označila jako skupinu, kde by vám zpětná vazba pomohla nejrychleji – i kdyby to nebyla celá firma?“</mark></em></li></ul></div><div style="display:contents" dir="auto"><p id="d23e128a-32d1-4ecb-afb3-d986421024dd" class="">
</p></div><div style="display:contents" dir="auto"><p id="1a73e979-5846-4eb4-a2ef-a3601e7c1219" class=""><strong>Naše řešení:</strong></p></div><div style="display:contents" dir="auto"><ul id="e6f06429-3100-406c-96d9-548e4997ac5e" class="bulleted-list"><li style="list-style-type:disc"><em><mark class="highlight-purple">Můžeme posílat na osobní emaily (stačí když sesbíráte od lidí souhlas k využití, rádi pošleme mustr)</mark></em></li></ul></div><div style="display:contents" dir="auto"><ul id="6f1492c8-5310-41cb-9ffa-4f6000a13084" class="bulleted-list"><li style="list-style-type:disc"><em><mark class="highlight-purple">Alternativně - budeme se ptát přes WhatsApp (pokud se domluvíme, budeme muset dovyvinout)</mark></em></li></ul></div></div></details></div><div style="display:contents" dir="auto"><details open=""><summary style="font-weight:600;font-size:1.25em;line-height:1.3;margin:0">28) Tohle by u nás umřelo / lidi to přestanou vyplňovat</summary><div class="indented"><div style="display:contents" dir="auto"><p id="e0003e12-ed09-4a76-8e0d-47690df097e7" class=""><strong>Reakce:</strong></p></div><div style="display:contents" dir="auto"><p id="400cab7b-5eed-4293-b59a-51829de6b702" class=""><em><mark class="highlight-default">„Když něco u vás dřív umřelo, čím myslíte to bylo?“</mark></em></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-8029-a43b-dab5b7c9e6f1"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8041-8460-c94b995146bd" class=""><mark class="highlight-default"><strong>Zákazník typicky řekne</strong></mark><mark class="highlight-default">: lidi v tom neviděli hodnotu / nic se s tím nedělo / manažeři s tím nepracovali / bylo to otravné (Ve většině případů to není o lidech, ale o tom, že z toho nejsou vidět konkrétní kroky)</mark></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-8023-8f39-dda6fa44e628"/></div><div style="display:contents" dir="auto"><p id="9be1e894-9453-4dbb-b581-130e9c0b3831" class=""><mark class="highlight-default">„Chápu. A co by se muselo stát, aby to u vás tentokrát neumřelo?</mark></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-805a-a4c1-f9db07092a7b"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-805d-acc5-c89e2e754c8c" class=""><mark class="highlight-default"><strong>Zákazník typicky řekne</strong></mark><mark class="highlight-default">: manažeři by s tím museli pracovat / lidi by museli vidět dopad </mark></p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-8088-868e-ddf1e05649ec"/></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-8037-8f19-c4df1ffd5b93" class=""><mark class="highlight-default">„Přesně na tom to máme postavené. Aby z toho šly rychlé, viditelné kroky na úrovni týmů, ne jen další sběr feedbacku.“</mark></p></div><div style="display:contents" dir="auto"><p id="332d8a3f-5e39-80f3-8d3d-c7ffc0210264" class="">
</p></div><div style="display:contents" dir="auto"><hr id="332d8a3f-5e39-80d4-afbf-d6cf4a1aeac5"/></div><div style="display:contents" dir="auto"><p id="e5111db4-4da3-4df1-885e-2bfc086fe24d" class=""><mark class="highlight-default"><strong>Delší reakce:</strong></mark></p></div><div style="display:contents" dir="auto"><p id="d703de83-1485-4856-94ab-bdfe0419b731" class=""><em>„Tohle je férová obava – vidíme ji často. V realitě to mívá typický průběh: po prvním kole bývá menší propad, protože je to novinka a lidi testují, jestli se s tím bude něco dít. Pak se to láme podle toho, co udělá vedení – když výsledky vezmete vážně a viditelně to odkomunikujete („co jsme slyšeli a co s tím uděláme / neuděláme“), response rate se většinou stabilizuje a dlouhodobě spíš roste. A ve firmách, kde s tím lídři pracují dobře, se z toho stane měsíční rituál – dvě minuty a hotovo.&quot;</em></p></div><div style="display:contents" dir="auto"><p id="48c06101-0624-4cb6-9a88-d0d5cd73f5d4" class=""><mark class="highlight-default"><strong>Doplnění, když tlačí dál:</strong></mark></p></div><div style="display:contents" dir="auto"><p id="001b0d87-2086-4a23-ada2-eb38d0b8e6b5" class=""><mark class="highlight-default">„Nejde o to, že by lidi bavilo vyplňovat dotazník. Funguje to, když mají pocit, že to má smysl a něco se z toho vrací zpátky. Když se nic nevrací, spadne to u jakéhokoli nástroje.&quot;</mark></p></div><div style="display:contents" dir="auto"><p id="5fd4aeb0-215c-49b4-8475-594670110aa3" class="">
</p></div><div style="display:contents" dir="auto"><p id="1f90c79d-1fc6-485f-b4ae-03c5261db4d2" class="">Důkaz místo slibů: Tady vidíš příklad vývoje participation u jednoho ze zákazníků, najdeš přímo v našem demo:</p></div><div style="display:contents" dir="ltr"><figure id="2ead8a3f-5e39-80a5-bd90-f0607e4b4782" class="image"><a href="NEW%204%202%20Handbook%20Demo%20&amp;%20questions%20objections/image.png"><img style="width:240px" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAwwAAAUGCAYAAAA8NDYnAAAAAXNSR0IArs4c6QAAAERlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAADDKADAAQAAAABAAAFBgAAAADj964tAABAAElEQVR4Aex9B6BeRdH23JtASCAF0khoSUgoCb2E3sVCEQuCICAgwkdR+BRREUUUQQUEfukiVUEpgiJVei+hBAKhppBCGgkJpCf3/s8zs7O7533vDUmkf7vJPbs7O2VndnbP7tk9521YuLCpuaFBpLm5WRqYEMTSKAubm6QR+QhvQkkbRUQ54SKNjUYHQkCAADrFZzlQG4DTTHiDIip/lmsB0ZW/RkoHCILJX9C0MMoHhkhTkzSpwIXAgTREjY2sBxLkL4Qn+SRJ8tsoX9MHcGQbonxoG/So1z/wg5yGpmboT8QmsIZ80Jt86tcGqiwENMlflP5a3Sgf5GrWRdu/mfKD/vXy309/VTDYH/WmOVqVz/pAP7RTtf0pHxXV9nH9kdP2XLL2p75go4oH8rr2r/W/5oVN0f50ribYg/ZvQnuw3RtkAVjC/oAr+yBD/Q9wCAj6Iw76U0+Tj5jUWjFwQwMl+dbOEGTyVYrrT3q2P+TDoRa7/VvR3/0PDD8W+xf5sWGK/dExPur+X/yv+F+4MZT+V/pfGX90fhLmhTr/s/Ehzf8Wb/7VzAlnPv/hxLjV+R/nT42yoG7+b/OfhibOvHT+RkRUiHVi4MSLFeYkisLwTxGtFHgB3/OVWGeDgHgcCkNW51ig5z8XyImfy9dJKKtF+SSFfCaUwgDQl9ND1o26K1DTKknrxkm0TSaJxhwnmlz0cLFAtXRFwUIW4R8NxayWVfRXsEvRcuLrBFPrpSyU0Lnp5NFaRQsVTlxOulW+aoMypwj2tGzF/roIUzlBz1hfIEf5qYwCc/nUR9kSV+WjtHHR8ulTZghyqw9mL69sbbkSA+hxKPesx1l53v6KndnfFgGUCI68IGXyNVkDt/KGZiwedBGZ1ZG0Qf8G9z8YhxjGDx6ljgIA2kgXhDQe6EimoolNAuRq298mPFZmSKRQZAKNAbMRHBMA1fQnKqqOqJR1lzr8Cobz9TgUetbjVJEiv9gfnpr7Kpyk+F+lV+WZ0v9qxqvcOHFciQONlXrW44jHIbGGXxn/Sv8r40+lV+WZuv6SF8Z+ZR0t7258kL0480+dc8H+af4fpi1N2GHgfYI3C1aCIQoAnIT6pInEKKA8/tmFCQuRphWAl+tiQHFMHiem6Wk8asB8qAdT+iQZ+Jz6s4wwpWGSmAqzck4RmVU/a4JGmPxpnVn3ANe6k1QXB8aLBKqjYqkE5UE+SX/yslsqeWidNaHMlJJzTRqYdNooQT6NxZoRnELSnwWt2d/0By4nuCrfFDa9kv6EqnwKqMhnhgJy+azjouXrZBiUulhRhZAOrBHVhbqyGkBNVukVhouXWeulPKttiwXETOuFC0uYF0Sc9HOnhxSMsAZCi document.addEventListener('DOMContentLoaded', function() {
  const FULL_QUOTE = /^[\u201e\u201c\u0022\u201d]/;

  // All confirmed non-quoted direct speech paragraphs
  const IMPLICIT_SPEECH = [
    /^My\s/,
    /Vid\u00edm,\s/,                   // Vidím, že...
    /nemus\u00edte/i,                   // nemusíte
    /^M\u016f\u017eete\b/,             // Můžete
    /^V\u00fdhodou\b/,                 // Výhodou navíc je...
    /^Abyste\b/,                        // Abyste si nemuseli...
    /^Nap\u0159\u00edklad tady/,       // Například tady v té firmě...
    /va\u0161\u00ed firm/i,            // vaší firmy/firmě
    /jsme ji/i,                         // jsme ji implementovali
    /^C\u00edlem je\b/,                // Cílem je aby se z manažerů...
    /^T\u011bch t\u00e9mat\b/,        // Těch témat je tam hodně...
    /^Super na tom je\b/,              // Super na tom je...
    /^Tak\u017ee m\u00e1me\b/,        // Takže máme velmi dobrou response rate...
  ];

  // Blockquotes — Demo section speech
  document.querySelectorAll('blockquote').forEach(el => {
    if (el.textContent.trim().length > 10) el.classList.add('sales-script');
  });

  // Principy anchor — skip everything after it
  const principyAnchor = document.getElementById('anchor-principy');

  document.querySelectorAll('.callout p, .callout li').forEach(el => {
    if (principyAnchor &&
        !(el.compareDocumentPosition(principyAnchor) & Node.DOCUMENT_POSITION_FOLLOWING)) return;
    const t = el.textContent.trim();
    if (t.startsWith('\u274C') || t.startsWith('\u2714') || t.length < 6) return;
    // Skip labels and action instructions (note: Cíl: with colon, not Cílem)
    if (/^(C\u00edl:|Ot\u00e1zky:|F\u00e1ze|Shrnut\u00ed|Cena|Next steps|Bezpe\u010dn\u00e1|Kontext|P\u0159\u00edklad|Akce|T\u00e9mata|Rychlost|Rychl\u00e1|T\u0159eba vyu\u017e\u00edt|Potvrzen\u00ed|Rozklikni|Vyber|P\u0159echod)/.test(t)) return;

    if (FULL_QUOTE.test(t) || IMPLICIT_SPEECH.some(re => re.test(t))) {
      el.classList.add('sales-script');
    } else {
      el.innerHTML = el.innerHTML.replace(/\u201e([^\u201c]+)\u201c/g,
        '<em class="inline-quote">\u201e$1\u201c</em>');
    }
  });

  // Silence tip
  document.querySelectorAll('p, li').forEach(el => {
    if (el.textContent.includes('Prvn\u00ed kdo mluv\u00ed')) el.classList.add('sales-silence');
  });

  // Forbidden words
  document.querySelectorAll('li').forEach(li => {
    if (li.textContent.trim().startsWith('\u274C')) li.parentElement.classList.add('sales-forbidden');
  });

  // Stats
  document.querySelectorAll('p, li').forEach(el => {
    el.innerHTML = el.innerHTML
      .replace(/nad 80\s*%/g, '<span class="sales-stat">nad 80\u00a0%</span>')
      .replace(/60\s*%[-\u2013]\s*70\s*%/g, '<span class="sales-stat">60\u201370\u00a0%</span>')
      .replace(/5\s*900\s*K\u010d/g, '<span class="sales-stat">5\u00a0900\u00a0K\u010d/m\u011bs</span>');
  });
});
</script>

<script id="toggle-all">
document.addEventListener('DOMContentLoaded', function() {
  const btn = document.getElementById('toggle-all-btn');
  if (!btn) return;
  let allOpen = false;
  btn.addEventListener('click', function() {
    allOpen = !allOpen;
    document.querySelectorAll('details').forEach(d => d.open = allOpen);
    btn.textContent = allOpen ? '⊖ Zabalit vše' : '⊕ Rozbalit vše';
  });
});
</script>

<script id="obj-search-js">
document.addEventListener('DOMContentLoaded', function() {
  const input   = document.getElementById('obj-search');
  const clearBtn = document.getElementById('search-clear');
  const countEl = document.getElementById('search-count');
  if (!input) return;

  // Build flat list of all details with their text + parent details
  const allDetails = Array.from(document.querySelectorAll('details'));
  const total = allDetails.length;

  function getFullText(el) {
    // summary text + all paragraph/li text inside
    return el.textContent.toLowerCase();
  }

  function doSearch(q) {
    q = q.trim().toLowerCase();
    clearBtn.style.display = q ? 'inline' : 'none';

    if (!q) {
      allDetails.forEach(d => d.classList.remove('search-hidden'));
      countEl.textContent = '';
      removeHighlights();
      return;
    }

    let visible = 0;
    allDetails.forEach(d => {
      const matches = getFullText(d).includes(q);
      d.classList.toggle('search-hidden', !matches);
      if (matches) { d.open = true; visible++; }
    });

    // Show parents of visible children
    allDetails.forEach(d => {
      if (!d.classList.contains('search-hidden')) {
        let parent = d.parentElement;
        while (parent) {
          if (parent.tagName === 'DETAILS') {
            parent.classList.remove('search-hidden');
            parent.open = true;
          }
          parent = parent.parentElement;
        }
      }
    });

    countEl.textContent = visible + ' z ' + total;
    highlightText(q);
  }

  function highlightText(q) {
    removeHighlights();
    if (!q) return;
    const walker = document.createTreeWalker(
      document.querySelector('article'), NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    nodes.forEach(node => {
      if (!node.textContent.toLowerCase().includes(q)) return;
      const parent = node.parentNode;
      if (parent.nodeName === 'SCRIPT' || parent.nodeName === 'STYLE') return;
      const span = document.createElement('span');
      span.innerHTML = node.textContent.replace(re, '<mark class="search-hl">$1</mark>');
      parent.replaceChild(span, node);
    });
  }

  function removeHighlights() {
    document.querySelectorAll('mark.search-hl').forEach(m => {
      m.replaceWith(m.textContent);
    });
    // Normalize text nodes
    document.querySelector('article').normalize();
  }

  input.addEventListener('input', () => doSearch(input.value));
  clearBtn.addEventListener('click', () => { input.value = ''; doSearch(''); input.focus(); });
});
</script>
</body>
